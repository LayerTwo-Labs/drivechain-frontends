version: "2"
run:
  tests: true
linters:
  enable:
    - copyloopvar
    - depguard
    - dupl
    - exhaustive
    - forbidigo
    - gocritic
    - goprintffuncname
    - nakedret
    - rowserrcheck
    - unconvert
    - unparam
    - zerologlint
  settings:
    gocritic:
      enabled-checks:
        - deferInLoop

    depguard:
      rules:
        all:
          deny:
            - pkg: log
              desc: use zerolog

            - pkg: github.com/rs/zerolog/log
              desc: use zerolog.Ctx or a logger value

            - pkg: github.com/btcsuite/btcutil
              desc: use github.com/btcsuite/btcd/btcutil

            - pkg: github.com/test-go/testify/require
              desc: use github.com/stretchr/testify/require

            - pkg: github.com/test-go/testify/assert
              desc: use github.com/stretchr/testify/assert

            - pkg: github.com/golang/protobuf
              desc: use google.golang.org/protobuf

    forbidigo:
      forbid:
        - pattern: assert.Error$
          msg: use assert.ErrorIs or assert.ErrorContains
        - pattern: require.Error$
          msg: use require.ErrorIs or require.ErrorContains
        - pattern: http.NewRequest$
          msg: use http.NewRequestWithContext
        - pattern: httptest.NewRequest$
          msg: use httptest.NewRequestWithContext
        - pattern: ^protojson\.Unmarshal$
          msg: use protojson.UnmarshalOptions{DiscardUnknown true}
      analyze-types: true

    staticcheck:
      checks:
        - "all"

        # Omit embedded fields from selector expression.
        - -QF1008

        # De Morgan
        - -QF1001

        # these are disabled by default
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - dupl
        path: _test.go
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/LayerTwo-Labs/sidesail
  exclusions:
    generated: lax
    paths:
      - openapi
      - third_party$
      - builtin$
      - examples$
