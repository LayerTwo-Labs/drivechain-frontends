syntax = "proto3";

package m4.v1;

option go_package = "github.com/LayerTwo-Labs/sidesail/bitwindow/server/gen/m4/v1;m4v1";

// M4 Explorer Service
service M4Service {
  // Get M4 voting history
  rpc GetM4History(GetM4HistoryRequest) returns (GetM4HistoryResponse);

  // Get the votes the enforcer puts in the next block it builds.
  rpc GetVotes(GetVotesRequest) returns (GetVotesResponse);

  // Upvote one pending bundle of a sidechain, or clear the upvote.
  rpc SetBundleUpvote(SetBundleUpvoteRequest) returns (SetBundleUpvoteResponse);

  // Set the vote for a sidechain that has no upvote.
  rpc SetVotePolicy(SetVotePolicyRequest) returns (SetVotePolicyResponse);
}

message M4Vote {
  uint32 sidechain_slot = 1;
  string vote_type = 2; // "abstain", "alarm", "upvote"
  optional string bundle_hash = 3;
  optional uint32 bundle_index = 4;
}

message M4HistoryEntry {
  uint32 block_height = 1;
  string block_hash = 2;
  int64 block_time = 3;
  uint32 version = 4;
  repeated M4Vote votes = 5;
}

message GetM4HistoryRequest {
  uint32 limit = 1; // Number of recent blocks (default 6)
}

message GetM4HistoryResponse {
  repeated M4HistoryEntry history = 1;
}

// The vote for a sidechain that has no upvote.
enum VotePolicy {
  VOTE_POLICY_UNSPECIFIED = 0;
  VOTE_POLICY_ABSTAIN = 1;
  // Upvote the first pending bundle that this enforcer proposed.
  VOTE_POLICY_UPVOTE_KNOWN = 2;
  // Upvote the first pending bundle.
  VOTE_POLICY_UPVOTE_ALL = 3;
  VOTE_POLICY_ALARM = 4;
}

message BundleUpvote {
  uint32 sidechain_slot = 1;
  string m6id = 2;
}

message GetVotesRequest {}
message GetVotesResponse {
  VotePolicy policy = 1;
  repeated BundleUpvote upvotes = 2;
}

message SetBundleUpvoteRequest {
  uint32 sidechain_slot = 1;
  // Unset clears the upvote, so the sidechain gets the policy vote.
  optional string m6id = 2;
}
message SetBundleUpvoteResponse {}

message SetVotePolicyRequest {
  VotePolicy policy = 1;
}
message SetVotePolicyResponse {}
