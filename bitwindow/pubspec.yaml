name: bitwindow
description:
  "A frontend for interacting with a Drivechain-enabled layer 1 bitcoin network."
publish_to: "none"

version: 0.2.263

environment:
  sdk: 3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.0
  fl_chart: ^1.3.0
  printing: ^5.15.1
  pdf: ^3.13.1

  stacked: ^3.5.0
  qr_flutter: ^4.1.0
  http: ^1.6.0
  intl: ^0.20.3
  collection: ^1.19.1
  path_provider: ^2.1.6
  sail_ui:
    path: ../sail_ui
  sidechain_core:
    path: ../sidechain_core
  thunder:
    path: ../thunder
  bitnames:
    path: ../bitnames
  bitassets:
    path: ../bitassets
  truthcoin:
    path: ../truthcoin
  zside:
    path: ../zside
  photon:
    path: ../photon
  coinshift:
    path: ../coinshift
  logger: ^2.8.0
  auto_route: ^11.2.0
  fixnum: ^1.1.1
  get_it: ^8.3.0
  protobuf: ^4.2.0
  window_manager: ^0.5.2
  skeletonizer: ^3.0.0
  flutter_markdown:
    path: ../third_party/flutter_markdown
  path: ^1.9.1
  url_launcher: ^6.3.3
  pointycastle: ^3.9.1
  crypto: ^3.0.8
  thirds: ^0.2.0-alpha.1
  connectrpc: ^1.0.0
  desktop_multi_window:
    git:
      url: https://github.com/octobocto/flutter-plugins.git
      ref: b9a9f5684eb1c81e203d17efef2915e183b05e9e
      path: packages/desktop_multi_window
  convert: ^3.1.2
  bs58: ^1.0.2
  auto_updater: ^1.0.0
  blockchain_utils: ^7.1.0
  archive: ^4.5.2
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  # Pinned: 4.7.1 and 4.8.0 fail to build on macOS with "module 'PatrolImpl' not found".
  patrol: 4.6.1
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/bitwindow.png"
    icon_size: 256
  macos:
    generate: true
  image_path: "assets/bitwindow.png"

flutter:
  uses-material-design: true

  assets:
    - assets/bin/
    - assets/articles/
    - assets/articles/beginner/
    - assets/articles/images/

# Windows release stuff.
# CI has a certificate.pfx we use to sign the build with
# https://pub.dev/packages/msix
msix_config:
  display_name: BitWindows
  languages: en-us
  windows_build_args: --dart-define-from-file=build-vars.env
  publisher: CN=DE47B41F-F9FE-43D5-9243-DB15A080F621
  publisher_display_name: LayerTwo Labs
  identity_name: 10520LayertwoLabs.BitWindows
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient,internetClientServer
  os_min_version: 10.0.17763.0
  store: false
  install_certificate: false
  sign_msix: true
