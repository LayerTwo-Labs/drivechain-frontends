syntax = "proto3";

package walletmanager.v1;

import "orchestrator/v1/orchestrator.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service WalletManagerService {
  // Wallet lifecycle
  rpc GetWalletStatus(GetWalletStatusRequest) returns (GetWalletStatusResponse);
  // How much of Bitcoin this install runs. The frontend asks the user before
  // it boots anything, and blocks until GetNodeMode reports a mode.
  // Deposits this install made to a sidechain treasury. An M5 is an ordinary
  // transaction on the wire, so the record comes from when we broadcast it.
  rpc ListSidechainDeposits(ListSidechainDepositsRequest) returns (ListSidechainDepositsResponse);
  rpc GetNodeMode(GetNodeModeRequest) returns (GetNodeModeResponse);
  rpc SetNodeMode(SetNodeModeRequest) returns (SetNodeModeResponse);
  rpc GenerateWallet(GenerateWalletRequest) returns (GenerateWalletResponse);
  rpc UnlockWallet(UnlockWalletRequest) returns (UnlockWalletResponse);
  rpc LockWallet(LockWalletRequest) returns (LockWalletResponse);
  rpc EncryptWallet(EncryptWalletRequest) returns (EncryptWalletResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc RemoveEncryption(RemoveEncryptionRequest) returns (RemoveEncryptionResponse);
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse);
  rpc SwitchWallet(SwitchWalletRequest) returns (SwitchWalletResponse);
  rpc UpdateWalletMetadata(UpdateWalletMetadataRequest) returns (UpdateWalletMetadataResponse);
  rpc DeleteWallet(DeleteWalletRequest) returns (DeleteWalletResponse);
  rpc DeleteAllWallets(DeleteAllWalletsRequest) returns (DeleteAllWalletsResponse);
  rpc ListWalletBackups(ListWalletBackupsRequest) returns (ListWalletBackupsResponse);
  rpc RestoreWalletBackup(RestoreWalletBackupRequest) returns (RestoreWalletBackupResponse);
  rpc RestoreWalletBackupStream(RestoreWalletBackupRequest) returns (stream RestoreWalletBackupProgressResponse);
  rpc CreateWatchOnlyWallet(CreateWatchOnlyWalletRequest) returns (CreateWatchOnlyWalletResponse);
  // Create an electrum wallet: keys are generated locally, but no local Bitcoin
  // Core or enforcer runs — chain data is served remotely via the datasource.
  rpc CreateElectrumWallet(CreateElectrumWalletRequest) returns (CreateElectrumWalletResponse);
  rpc CreateMultisigWallet(CreateMultisigWalletRequest) returns (CreateMultisigWalletResponse);
  // ParseMultisigConfig parses a descriptor or a wallet-config file (Coldcard
  // text / Sparrow / Specter / Caravan JSON) into an m-of-n policy + cosigners.
  rpc ParseMultisigConfig(ParseMultisigConfigRequest) returns (ParseMultisigConfigResponse);
  // ValidateDescriptor reads an output descriptor — single-sig or sortedmulti —
  // into the script policy it encodes.
  rpc ValidateDescriptor(ValidateDescriptorRequest) returns (ValidateDescriptorResponse);
  // ValidateDerivationPath canonicalises a BIP32 derivation path, or fails with
  // the reason it is unusable.
  rpc ValidateDerivationPath(ValidateDerivationPathRequest) returns (ValidateDerivationPathResponse);
  // ListDerivationPaths returns the standard account paths for a policy on the
  // network this backend runs.
  rpc ListDerivationPaths(ListDerivationPathsRequest) returns (ListDerivationPathsResponse);

  // Core wallet management
  rpc CreateBitcoinCoreWallet(CreateBitcoinCoreWalletRequest) returns (CreateBitcoinCoreWalletResponse);
  rpc EnsureCoreWallets(EnsureCoreWalletsRequest) returns (EnsureCoreWalletsResponse);

  // Bitcoin operations (proxied through Core RPC)
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc RescanWallet(RescanWalletRequest) returns (RescanWalletResponse);
  rpc EstimateFee(EstimateFeeRequest) returns (EstimateFeeResponse);
  rpc GetNewAddress(GetNewAddressRequest) returns (GetNewAddressResponse);
  rpc SendTransaction(SendTransactionRequest) returns (SendTransactionResponse);

  // CreateDeposit funds a BIP300 M5 deposit to a sidechain from any wallet.
  rpc CreateDeposit(CreateDepositRequest) returns (CreateDepositResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc ListUnspent(ListUnspentRequest) returns (ListUnspentResponse);
  rpc ListReceiveAddresses(ListReceiveAddressesRequest) returns (ListReceiveAddressesResponse);
  rpc GetTransactionDetails(GetTransactionDetailsRequest) returns (GetTransactionDetailsResponse);
  rpc DecodeTransaction(DecodeTransactionRequest) returns (DecodeTransactionResponse);
  rpc BumpFee(BumpFeeRequest) returns (BumpFeeResponse);
  // CreateCpfp spends an unconfirmed wallet UTXO with a child transaction whose
  // fee lifts the parent+child package to the target fee rate (CPFP).
  rpc CreateCpfp(CreateCpfpRequest) returns (CreateCpfpResponse);
  rpc DeriveAddresses(DeriveAddressesRequest) returns (DeriveAddressesResponse);

  // PSBT (BIP174). CreatePsbt builds an unsigned PSBT for a send (works for
  // watch-only wallets); SignPsbt adds this wallet's signatures; CombinePsbt
  // merges cosigner PSBTs; FinalizePsbt extracts the raw transaction. Electrum
  // wallets only.
  rpc CreatePsbt(CreatePsbtRequest) returns (CreatePsbtResponse);
  rpc SignPsbt(SignPsbtRequest) returns (SignPsbtResponse);
  // SignPsbtWithCosigner signs a multisig PSBT with a single held cosigner's key
  // (per-keystore signing), leaving the other legs for their own signers.
  rpc SignPsbtWithCosigner(SignPsbtWithCosignerRequest) returns (SignPsbtWithCosignerResponse);
  rpc CombinePsbt(CombinePsbtRequest) returns (CombinePsbtResponse);
  rpc FinalizePsbt(FinalizePsbtRequest) returns (FinalizePsbtResponse);
  // MultisigPsbtStatus reports signing progress for a multisig wallet's PSBT:
  // signature count, whether it can be finalized, and which cosigners signed.
  rpc MultisigPsbtStatus(MultisigPsbtStatusRequest) returns (MultisigPsbtStatusResponse);
  // BroadcastTransaction broadcasts a finalized raw transaction over the
  // wallet's chain source and returns its txid.
  rpc BroadcastTransaction(BroadcastTransactionRequest) returns (BroadcastTransactionResponse);

  // Address reads that belong to no wallet — cheque addresses, whose funds are
  // not the user's to spend. Always electrum-backed, whatever wallet is active.
  rpc GetAddressUnspent(GetAddressUnspentRequest) returns (GetAddressUnspentResponse);
  rpc BroadcastElectrumTransaction(BroadcastElectrumTransactionRequest) returns (BroadcastElectrumTransactionResponse);

  // USB hardware wallets.
  rpc EnumerateHardwareDevices(EnumerateHardwareDevicesRequest) returns (EnumerateHardwareDevicesResponse);
  rpc GetHardwareXpub(GetHardwareXpubRequest) returns (GetHardwareXpubResponse);
  rpc SignPsbtWithDevice(SignPsbtWithDeviceRequest) returns (SignPsbtWithDeviceResponse);
  // PromptDevicePin shows the PIN matrix; SendDevicePin unlocks with it.
  rpc PromptDevicePin(PromptDevicePinRequest) returns (PromptDevicePinResponse);
  rpc SendDevicePin(SendDevicePinRequest) returns (SendDevicePinResponse);
  // CloseDevice releases the device so the next enumerate isn't blocked.
  rpc CloseDevice(CloseDeviceRequest) returns (CloseDeviceResponse);

  // DeriveKeystore turns a keystore's intent into derived account key material.
  rpc DeriveKeystore(DeriveKeystoreRequest) returns (DeriveKeystoreResponse);

  // PreviewWalletFromEntropy derives a wallet without saving it, so a caller can
  // show the words while the user is still choosing their entropy.
  rpc PreviewWalletFromEntropy(PreviewWalletFromEntropyRequest) returns (PreviewWalletFromEntropyResponse);

  // Seed access for cheque engine
  rpc GetWalletSeed(GetWalletSeedRequest) returns (GetWalletSeedResponse);

  // Bitcoin Core variant selection (untouched / touched / knots).
  rpc ListCoreVariants(ListCoreVariantsRequest) returns (ListCoreVariantsResponse);
  rpc GetCoreVariant(GetCoreVariantRequest) returns (GetCoreVariantResponse);
  rpc SetCoreVariant(SetCoreVariantRequest) returns (SetCoreVariantResponse);

  // Test-sidechains toggle. When enabled, layer-2 binaries download/run from
  // the alternative_download config (test builds) instead of the default.

  // Electrum server (Esplora endpoint) selection for electrum wallets.
  rpc GetElectrumServer(GetElectrumServerRequest) returns (GetElectrumServerResponse);
  rpc SetElectrumServer(SetElectrumServerRequest) returns (SetElectrumServerResponse);

  // Tor SOCKS5 proxy routing for the electrum wallet's chain connections.
  rpc GetTorConfig(GetTorConfigRequest) returns (GetTorConfigResponse);
  rpc SetTorConfig(SetTorConfigRequest) returns (SetTorConfigResponse);

  // Stream wallet state changes. Sends the full wallet state immediately,
  // then again whenever wallets or balance change.
  rpc WatchWalletData(google.protobuf.Empty) returns (stream WatchWalletDataResponse);
}

// ============================================================================
// Status
// ============================================================================

message GetWalletStatusRequest {}

message GetWalletStatusResponse {
  bool has_wallet = 1;
  bool encrypted = 2;
  bool unlocked = 3;
  string active_wallet_id = 4;
  string active_wallet_name = 5;
}

// NodeMode is how much of Bitcoin this install runs.
enum NodeMode {
  // The user never picked. The frontend must ask before it boots anything.
  NODE_MODE_UNSPECIFIED = 0;
  // Runs Bitcoin Core and the enforcer on this machine.
  NODE_MODE_FULL = 1;
  // Reads the chain from a remote Esplora server, and starts no local daemon.
  NODE_MODE_LIGHT = 2;
}

message ListSidechainDepositsRequest {
  uint32 slot = 1;
}

message SidechainDeposit {
  string txid = 1;
  string wallet_id = 2;
  uint32 slot = 3;
  string destination = 4;
  int64 amount_sats = 5;
  string created_at = 6; // ISO 8601
}

message ListSidechainDepositsResponse {
  repeated SidechainDeposit deposits = 1;
}

message GetNodeModeRequest {}

message GetNodeModeResponse {
  NodeMode mode = 1;
  // False when the current network serves no Esplora, so light mode cannot
  // read a chain. Regtest and testnet.
  bool light_mode_available = 2;
}

message SetNodeModeRequest {
  NodeMode mode = 1;
}

message SetNodeModeResponse {}

// ============================================================================
// Generate
// ============================================================================

message GenerateWalletRequest {
  string name = 1;
  string custom_mnemonic = 2; // optional
  string passphrase = 3; // optional
  // Optional BIP32 account index for the wallet's account-level key
  // (purpose'/coin'/account'). 0 = standard. Ignored when derivation_path set.
  uint32 account = 4;
  // Optional full account-level derivation path (e.g. "m/84'/0'/3'"),
  // overriding the default purpose/coin/account. Empty = default (BIP84,
  // network coin, account field). All three levels must be hardened.
  string derivation_path = 5;
}

message GenerateWalletResponse {
  string wallet_id = 1;
  string mnemonic = 2; // master mnemonic for display to user
}

// ============================================================================
// Unlock/Lock
// ============================================================================

message UnlockWalletRequest {
  string password = 1;
}

message UnlockWalletResponse {}

message LockWalletRequest {}

message LockWalletResponse {}

// ============================================================================
// Encrypt
// ============================================================================

message EncryptWalletRequest {
  string password = 1;
}

message EncryptWalletResponse {}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message RemoveEncryptionRequest {
  string password = 1;
}

message RemoveEncryptionResponse {}

// ============================================================================
// List/Switch/Update/Delete Wallets
// ============================================================================

enum WalletType {
  WALLET_TYPE_UNSPECIFIED = 0;
  WALLET_TYPE_BITCOIN_CORE = 1;
  WALLET_TYPE_ENFORCER = 2;
  // Electrum wallet — keys are local, but it runs neither Bitcoin Core nor the
  // enforcer locally; chain/wallet read data is served via the datasource layer.
  WALLET_TYPE_ELECTRUM = 3;
}

message WalletMetadata {
  string id = 1;
  string name = 2;
  WalletType wallet_type = 3;
  string gradient_json = 4;
  string created_at = 5; // ISO 8601
  // BIP47 v3 payment code derived from the wallet's master pubkey.
  // Deterministic per wallet, never changes. Empty for watch-only wallets.
  string bip47_payment_code = 6;

  // Starter material — populated for the starter wallet only, empty otherwise.
  // The Starters tab and HD wallet provider read these instead of hitting a
  // separate RPC.
  string master_mnemonic = 7;
  string l1_mnemonic = 8;
  repeated SidechainStarter sidechains = 9;

  // Watch-only wallets track an external xpub/descriptor; no spending key.
  bool watch_only = 10;

  // Multisig policy, present only for multisig wallets. Cosigner private
  // material is never exposed here — only public data and a held flag.
  MultisigInfo multisig = 11;

  // Device type and master fingerprint for a single-sig hardware wallet.
  string hardware_device_type = 12;
  string hardware_fingerprint = 13;

  // The address types this wallet derives, its own kind first. A wallet on an
  // explicit derivation path, a watch-only wallet, and a multisig wallet each
  // derive exactly one.
  repeated AddressType receive_address_types = 14;

  // True for the one wallet whose seed derives the L1 and sidechain starters.
  // Each wallet carries its own seed, so this never moves once recorded.
  bool is_starter = 15;
}

message MultisigInfo {
  uint32 m = 1; // threshold
  uint32 n = 2; // total cosigners
  string script_type = 3; // wsh | sh-wsh | sh
  repeated MultisigCosignerInfo cosigners = 4;
}

message MultisigCosignerInfo {
  string xpub = 1;
  string fingerprint = 2;
  string origin_path = 3;
  bool held = 4; // this wallet holds the key and can sign for this cosigner
  // Device type when this leg signs on a USB device.
  string hardware_device_type = 5;
}

message SidechainStarter {
  int32 slot = 1;
  string name = 2;
  string mnemonic = 3;
}

message ListWalletsRequest {}

message ListWalletsResponse {
  repeated WalletMetadata wallets = 1;
  string active_wallet_id = 2;
}

message SwitchWalletRequest {
  string wallet_id = 1;
  // The user's answer when a previous attempt reported must_select_datadir.
  string data_dir = 2;
}

message SwitchWalletResponse {}

message UpdateWalletMetadataRequest {
  string wallet_id = 1;
  string name = 2;
  string gradient_json = 3;
}

message UpdateWalletMetadataResponse {}

message DeleteWalletRequest {
  string wallet_id = 1;
}

message DeleteWalletResponse {}

message DeleteAllWalletsRequest {}

message DeleteAllWalletsResponse {}

message BalanceSnapshot {
  orchestrator.v1.BinaryType binary = 1;
  string display_name = 2;
  uint64 confirmed_sats = 3;
  uint64 pending_sats = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message BackupWalletSummary {
  string id = 1;
  string name = 2;
  string wallet_type = 3;
}

message WalletBackup {
  string backup_id = 1;
  google.protobuf.Timestamp created_at = 2;
  string source_name = 3;
  bool encrypted = 4;
  bool has_metadata = 5;
  string active_wallet_id = 6;
  repeated BackupWalletSummary wallets = 7;
  repeated BalanceSnapshot latest_known_balance = 8;
  bool valid = 9;
  string error_message = 10;
}

message ListWalletBackupsRequest {}

message ListWalletBackupsResponse {
  repeated WalletBackup backups = 1;
}

message RestoreWalletBackupRequest {
  string backup_id = 1;
  string password = 2;
}

message RestoreWalletBackupResponse {}

message RestoreWalletBackupStep {
  string step_id = 1;
  string name = 2;
}

enum RestoreWalletBackupStepState {
  RESTORE_WALLET_BACKUP_STEP_STATE_UNSPECIFIED = 0;
  RESTORE_WALLET_BACKUP_STEP_STATE_STARTED = 1;
  RESTORE_WALLET_BACKUP_STEP_STATE_COMPLETED = 2;
  RESTORE_WALLET_BACKUP_STEP_STATE_FAILED = 3;
}

message RestoreWalletBackupProgressStatus {
  string step_id = 1;
  RestoreWalletBackupStepState state = 2;
  string error = 3;
  bool complete = 4;
}

message RestoreWalletBackupProgressResponse {
  repeated RestoreWalletBackupStep steps = 1;
  RestoreWalletBackupProgressStatus status = 2;
}

// ============================================================================
// Swap Enforcer Wallet
// ============================================================================






// ============================================================================
// Watch-Only Wallet
// ============================================================================

message CreateWatchOnlyWalletRequest {
  string name = 1;
  string xpub_or_descriptor = 2;
  string gradient_json = 3;
}

message CreateWatchOnlyWalletResponse {
  string wallet_id = 1;
}

// ============================================================================
// Electrum Wallet
// ============================================================================

message CreateElectrumWalletRequest {
  string name = 1;
  string gradient_json = 2;
  // Optional sidechain slots to provision starter material for. Empty = all.
  repeated uint32 slots = 3;
  // Optional BIP39 mnemonic to import an existing seed. Empty = generate a
  // new seed. Mutually exclusive with xpub_or_descriptor.
  string custom_mnemonic = 4;
  // Optional xpub or output descriptor for a watch-only electrum wallet
  // (no private keys; cannot sign or send). Mutually exclusive with
  // custom_mnemonic.
  string xpub_or_descriptor = 5;
  // Address type for a hot wallet: "legacy", "nested-segwit",
  // "native-segwit" (default), or "taproot". Ignored for watch-only imports
  // (the descriptor's own type wins).
  string script_type = 6;
  // Optional BIP32 account index for the account-level key. 0 = standard.
  // Ignored when derivation_path set or for watch-only imports.
  uint32 account = 7;
  // Optional full account-level derivation path (e.g. "m/84'/0'/3'"),
  // overriding purpose/coin/account. Empty = default. All three levels must be
  // hardened. Ignored for watch-only imports.
  string derivation_path = 8;
  // Device type and master fingerprint when importing a hardware wallet.
  string hardware_device_type = 9;
  string hardware_fingerprint = 10;
  // Optional BIP39 passphrase applied to custom_mnemonic. Ignored for
  // watch-only imports.
  string passphrase = 11;
}

message CreateElectrumWalletResponse {
  string wallet_id = 1;
}

// MultisigCosignerInput is one leg of a multisig wallet. A cosigner with a
// mnemonic or xprv is held on disk (this wallet signs with it); one with only
// an xpub is a watch-only leg signed elsewhere.
message MultisigCosignerInput {
  string xpub = 1;
  string origin_path = 2; // without leading m/, e.g. "48'/1'/0'/2'"
  string fingerprint = 3; // master key fingerprint, 8 hex chars
  string mnemonic = 4;    // held: BIP39 seed, stored so the wallet can sign
  string xprv = 5;        // held: account-level xprv, alternative to mnemonic
  string passphrase = 6;  // optional BIP39 passphrase for mnemonic
  // Device type ("trezor", "ledger", ...) when this leg signs on a USB device.
  string hardware_device_type = 7;
}

message CreateMultisigWalletRequest {
  string name = 1;
  string gradient_json = 2;
  uint32 m = 3; // threshold (signatures required)
  uint32 n = 4; // total cosigners
  // "wsh" (native P2WSH, default), "sh-wsh" (nested P2SH-P2WSH), or "sh"
  // (legacy P2SH).
  string script_type = 5;
  repeated MultisigCosignerInput cosigners = 6;
}

message CreateMultisigWalletResponse {
  string wallet_id = 1;
}

message ParseMultisigConfigRequest {
  // An output descriptor or a wallet-config file's contents.
  string content = 1;
}

message ParsedCosigner {
  string xpub = 1;
  string fingerprint = 2;
  string origin_path = 3;
}

message ParseMultisigConfigResponse {
  uint32 m = 1;
  uint32 n = 2;
  string script_type = 3; // wsh | sh-wsh | sh
  repeated ParsedCosigner cosigners = 4;
}

message ValidateDescriptorRequest {
  // An output descriptor, single-sig or sortedmulti.
  string descriptor = 1;
}

message ValidateDerivationPathRequest {
  string path = 1;
  bool multisig = 2;
}

message ValidateDerivationPathResponse {
  string normalized = 1; // canonical form, e.g. "m/48'/1'/0'/2'"
  // Script type this path is the standard account path for; empty for a custom
  // path, which is still valid.
  string script_type = 2;
}

message ListDerivationPathsRequest {
  // single-sig: "legacy" | "nested-segwit" | "native-segwit" | "taproot";
  // multisig: "sh" | "sh-wsh" | "wsh" | "tr".
  string script_type = 1;
  bool multisig = 2;
  uint32 account = 3;
}

message DerivationPathOption {
  string label = 1;
  string path = 2;
}

message ListDerivationPathsResponse {
  repeated DerivationPathOption options = 1;
  string default_path = 2; // the path used when a keystore sets none
}

message ValidateDescriptorResponse {
  bool multisig = 1;
  // wpkh | sh-wpkh | pkh | tr, or wsh | sh-wsh | sh | tr when multisig.
  string script_type = 2;
  uint32 m = 3; // signatures required
  uint32 n = 4; // total keys
  repeated ParsedCosigner keys = 5;
}

// ============================================================================
// Core Wallet Management
// ============================================================================

message CreateBitcoinCoreWalletRequest {
  string wallet_id = 1;  // wallet ID from wallet.json
}

message CreateBitcoinCoreWalletResponse {
  string core_wallet_name = 1;  // Bitcoin Core wallet name
}

message EnsureCoreWalletsRequest {}

message EnsureCoreWalletsResponse {
  int32 synced_count = 1;
}

// ============================================================================
// Bitcoin Operations
// ============================================================================

message GetBalanceRequest {
  string wallet_id = 1;  // empty = active wallet
}

message RescanWalletRequest {
  string wallet_id = 1;  // empty = active wallet
}

message RescanWalletResponse {}

message EstimateFeeRequest {
  int32 conf_target = 1;
}

message EstimateFeeResponse {
  double sat_per_vbyte = 1;
}

message GetBalanceResponse {
  double confirmed_sats = 1;
  double unconfirmed_sats = 2;
}

enum AddressType {
  ADDRESS_TYPE_UNSPECIFIED = 0;
  ADDRESS_TYPE_SEGWIT = 1;
  ADDRESS_TYPE_TAPROOT = 2;
}

message GetNewAddressRequest {
  string wallet_id = 1;  // empty = active wallet
  AddressType address_type = 2;
}

message GetNewAddressResponse {
  string address = 1;
  int32 index = 2;
  string derivation_path = 3;
}

message SendTransactionRequest {
  string wallet_id = 1;  // empty = active wallet
  map<string, int64> destinations = 2;  // address -> satoshis
  int64 fee_rate_sat_per_vbyte = 3;     // 0 = use default
  bool subtract_fee_from_amount = 4;
  // Raw OP_RETURN payload hex.
  string op_return_hex = 5;
  // Exact fee in sats when caller wants deterministic fee selection.
  int64 fixed_fee_sats = 6;
  // Explicit wallet inputs to spend.
  repeated UnspentOutput required_inputs = 7;
  // Build a replay-protected transaction: stamp the magic nLockTime
  // (499999999) and non-final input sequences so stock Bitcoin Core rejects it
  // as non-final, while a patched bitcoind confirms it. Core/Electrum only.
  bool replay_protect = 8;
  // Outputs with an explicit raw scriptPubKey, kept in order before any
  // address/op_return outputs. Used for non-standard scripts (e.g. a sidechain
  // OP_DRIVECHAIN treasury output).
  repeated RawOutput raw_outputs = 9;
  // Inputs not owned by the wallet that must be spent as-is, in order, before
  // wallet-funded inputs. Used for anyone-can-spend scripts (e.g. a sidechain
  // CTIP). They are added with an empty scriptSig and not signed.
  repeated ExternalInput external_inputs = 10;
  // Signal BIP125, so a later transaction spending the same inputs replaces
  // this one. Used to raise a BMM bid.
  bool replaceable = 11;
}

message SendTransactionResponse {
  string txid = 1;
}

// RawOutput is a transaction output with a caller-supplied scriptPubKey.
message RawOutput {
  int64 value_sats = 1;
  string script_hex = 2;
}

// ExternalInput is a UTXO spent by the transaction that the wallet does not own
// and does not sign — its script must be satisfiable with an empty scriptSig.
message ExternalInput {
  string txid = 1;
  int32 vout = 2;
  int64 value_sats = 3;
  string script_pubkey_hex = 4;
}

message CreatePsbtRequest {
  string wallet_id = 1;  // empty = active wallet
  map<string, int64> destinations = 2;  // address -> satoshis
  int64 fee_rate_sat_per_vbyte = 3;     // 0 = use default
  bool subtract_fee_from_amount = 4;
  string op_return_hex = 5;
  int64 fixed_fee_sats = 6;
  repeated UnspentOutput required_inputs = 7;
  repeated RawOutput raw_outputs = 8;
  repeated ExternalInput external_inputs = 9;
}

message CreatePsbtResponse {
  string psbt_base64 = 1;
}

message SignPsbtRequest {
  string wallet_id = 1;  // empty = active wallet
  string psbt_base64 = 2;
}

message SignPsbtResponse {
  string psbt_base64 = 1;
}

message SignPsbtWithCosignerRequest {
  string wallet_id = 1;
  string psbt_base64 = 2;
  string cosigner_xpub = 3;
}

message SignPsbtWithCosignerResponse {
  string psbt_base64 = 1;
}

message CombinePsbtRequest {
  repeated string psbt_base64 = 1;
}

message CombinePsbtResponse {
  string psbt_base64 = 1;
}

message FinalizePsbtRequest {
  string psbt_base64 = 1;
}

message FinalizePsbtResponse {
  string raw_tx_hex = 1;
}

message MultisigPsbtStatusRequest {
  string wallet_id = 1;
  string psbt_base64 = 2;
}

message MultisigPsbtStatusResponse {
  uint32 threshold = 1;  // signatures required (m)
  uint32 signatures = 2; // signatures present (max across inputs)
  bool finalizable = 3;
  // Aligned to the wallet's cosigners; true where that cosigner has signed.
  repeated bool cosigner_signed = 4;
}

message BroadcastTransactionRequest {
  string wallet_id = 1;
  string tx_hex = 2;
}

message BroadcastTransactionResponse {
  string txid = 1;
}

message GetAddressUnspentRequest {
  string address = 1;
}

message AddressUnspentOutput {
  string txid = 1;
  int32 vout = 2;
  int64 value_sats = 3;
  int32 confirmations = 4;
  int64 block_time = 5;
}

message GetAddressUnspentResponse {
  repeated AddressUnspentOutput utxos = 1;
  int32 tip_height = 2;
}

message BroadcastElectrumTransactionRequest {
  string tx_hex = 1;
}

message BroadcastElectrumTransactionResponse {
  string txid = 1;
}

// HardwareDevice is one connected USB signer. error is set when the device was
// found but could not be opened.
message HardwareDevice {
  string type = 1;
  string model = 2;
  string label = 3;
  string path = 4;
  string fingerprint = 5;
  bool needs_pin = 6;
  bool needs_passphrase = 7;
  string error = 8;
  // Raw HWI error code: -18 uninitialized, -12 busy/locked, 0 none.
  int32 error_code = 9;
}

// HardwareDeviceSelector identifies which device a command targets.
message HardwareDeviceSelector {
  string type = 1;
  string path = 2;
  string fingerprint = 3;
  string passphrase = 4; // BIP39 passphrase for passphrase-protected devices
}

message EnumerateHardwareDevicesRequest {
  string passphrase = 1; // confirm the passphrase wallet's fingerprint
}

message EnumerateHardwareDevicesResponse {
  repeated HardwareDevice devices = 1;
}

message GetHardwareXpubRequest {
  HardwareDeviceSelector device = 1;
  string derivation_path = 2;
}

message GetHardwareXpubResponse {
  string xpub = 1;
}

message SignPsbtWithDeviceRequest {
  HardwareDeviceSelector device = 1;
  string psbt_base64 = 2;
}

message SignPsbtWithDeviceResponse {
  string psbt_base64 = 1;
}

message PromptDevicePinRequest {
  HardwareDeviceSelector device = 1;
}

message PromptDevicePinResponse {}

message SendDevicePinRequest {
  HardwareDeviceSelector device = 1;
  string pin = 2; // matrix positions the user picked, not the actual digits
}

message SendDevicePinResponse {}

message CloseDeviceRequest {
  HardwareDeviceSelector device = 1;
}

message CloseDeviceResponse {}

// DeriveKeystoreRequest carries one source plus the intent to derive from.
message DeriveKeystoreRequest {
  string mnemonic = 1;
  string passphrase = 2; // optional, with mnemonic
  HardwareDeviceSelector device = 3;
  string raw_key = 4; // pasted "[fp/origin]xpub", bare xpub, or descriptor
  // single-sig: "legacy" | "nested-segwit" | "native-segwit" | "taproot";
  // multisig: "sh" | "sh-wsh" | "wsh" | "tr".
  string script_type = 5;
  bool multisig = 6;
  uint32 account = 7;
  // Full account path, e.g. "m/48'/1'/0'/2'". Empty uses the standard path for
  // the script type.
  string derivation_path = 8;
}

message DeriveKeystoreResponse {
  string xpub = 1;
  string fingerprint = 2;
  string origin_path = 3; // without leading m/
  // Single-sig watch descriptor for device/raw sources; empty for multisig.
  string descriptor = 4;
}



message ListTransactionsRequest {
  string wallet_id = 1;
  int32 count = 2;   // 0 = default (100)
}

message TransactionEntry {
  string txid = 1;
  int32 vout = 2;
  string address = 3;
  string category = 4;  // send, receive, generate, immature
  double amount = 5;    // BTC
  int64 amount_sats = 6;
  int32 confirmations = 7;
  int64 block_time = 8;
  int64 time = 9;
  string label = 10;
  double fee = 11;
  bool replaced_by_txid = 12;
  string wallet_id = 13;
}

message ListTransactionsResponse {
  repeated TransactionEntry transactions = 1;
}

message ListUnspentRequest {
  string wallet_id = 1;
}

message UnspentOutput {
  string txid = 1;
  int32 vout = 2;
  string address = 3;
  double amount = 4;    // BTC
  int64 amount_sats = 5;
  int32 confirmations = 6;
  string label = 7;
  bool spendable = 8;
  bool solvable = 9;
  string wallet_id = 10;
  // Wallet's first-seen mempool timestamp when available, otherwise the
  // confirming block's time. Unset if neither is known.
  google.protobuf.Timestamp received_at = 11;
  // BIP32 path of the address that owns this output. Empty when the backend
  // cannot report one (Bitcoin Core bulk lists, the enforcer).
  string derivation_path = 12;
  // True when the outpoint exists unspent on BTC mainnet. Unset until the
  // split engine checked it.
  optional bool splittable = 13;
}

message ListUnspentResponse {
  repeated UnspentOutput utxos = 1;
}

message ListReceiveAddressesRequest {
  string wallet_id = 1;
}

message ReceiveAddress {
  string address = 1;
  double amount = 2;  // BTC total received
  int64 amount_sats = 3;
  string label = 4;
  int32 tx_count = 5;
  bool is_change = 6;  // internal change address vs external receive address
  // BIP32 path this address derives from. Empty when the backend cannot
  // report one (Bitcoin Core bulk lists, the enforcer).
  string derivation_path = 7;
}

message ListReceiveAddressesResponse {
  repeated ReceiveAddress addresses = 1;
}

message GetTransactionDetailsRequest {
  string wallet_id = 1;
  string txid = 2;
}

message GetTransactionDetailsResponse {
  TransactionEntry transaction = 1;
  string raw_hex = 2;
  string blockhash = 3;
  int32 confirmations = 4;
  int64 block_time = 5;
  int32 version = 6;
  int32 locktime = 7;
  int32 size_bytes = 8;
  int32 vsize_vbytes = 9;
  int32 weight_wu = 10;
  int64 fee_sats = 11;
  double fee_rate_sat_vb = 12;
  repeated TransactionInput inputs = 13;
  int64 total_input_sats = 14;
  repeated TransactionOutput outputs = 15;
  int64 total_output_sats = 16;
}

message TransactionInput {
  int32 index = 1;
  string prev_txid = 2;
  int32 prev_vout = 3;
  string address = 4;
  int64 value_sats = 5;
  string script_sig_asm = 6;
  string script_sig_hex = 7;
  repeated string witness = 8;
  int64 sequence = 9;
  bool is_coinbase = 10;
}

message TransactionOutput {
  int32 index = 1;
  int64 value_sats = 2;
  string address = 3;
  string script_type = 4;
  string script_pubkey_asm = 5;
  string script_pubkey_hex = 6;
  // PSBT-only: the output carries the wallet's derivation records, so it is
  // the change output.
  bool is_change = 7;
}

// DecodeTransaction inspects a pasted txid, raw transaction hex, or base64 PSBT
// and returns its decoded inputs/outputs/fee. Read-only: nothing is signed or
// broadcast.
message DecodeTransactionRequest {
  // A 64-hex-char txid, a raw transaction hex, or a base64 PSBT. The form is
  // auto-detected.
  string input = 1;
  // Optional wallet to resolve a txid against (and enrich input values). Empty
  // uses the active wallet.
  string wallet_id = 2;
}

// DecodedForm reports which artifact the input was recognized as.
enum DecodedForm {
  DECODED_FORM_UNSPECIFIED = 0;
  DECODED_FORM_TXID = 1;
  DECODED_FORM_RAW_TX = 2;
  DECODED_FORM_PSBT = 3;
}

message DecodeTransactionResponse {
  DecodedForm form = 1;
  string txid = 2;
  int32 version = 3;
  int32 locktime = 4;
  int32 size_bytes = 5;
  int32 vsize_vbytes = 6;
  int32 weight_wu = 7;
  repeated TransactionInput inputs = 8;
  repeated TransactionOutput outputs = 9;
  int64 total_input_sats = 10;
  // True when every input value is known, so total_input_sats and fee are exact.
  bool has_total_input = 11;
  int64 total_output_sats = 12;
  int64 fee_sats = 13;
  bool has_fee = 14;
  double fee_rate_sat_vb = 15;
  // PSBT-only: how many inputs already carry a signature.
  bool is_psbt = 16;
  int32 signed_inputs = 17;
  // Raw transaction hex, or base64 for a PSBT.
  string raw = 18;
}

message BumpFeeRequest {
  string wallet_id = 1;
  string txid = 2;
  int64 new_fee_rate = 3;  // sat/vB, 0 = automatic
}

message BumpFeeResponse {
  string new_txid = 1;
}

message CreateCpfpRequest {
  string wallet_id = 1;
  string parent_txid = 2;
  int32 parent_vout = 3;
  int64 target_fee_rate = 4;  // sat/vB, package fee rate the parent+child must reach
}

message CreateCpfpResponse {
  string child_txid = 1;  // broadcast child transaction id
}

message DeriveAddressesRequest {
  string wallet_id = 1;
  int32 start_index = 2;
  int32 count = 3;
}

message DeriveAddressesResponse {
  repeated string addresses = 1;
}

// ============================================================================
// Seed Access
// ============================================================================

message PreviewWalletFromEntropyRequest {
  // Raw entropy: 16 bytes for 12 words, 32 for 24. Takes precedence over
  // source_text.
  bytes entropy = 1;
  // Arbitrary user text, hashed into entropy. Any length, including one
  // character. Exact-length hex (32 or 64 chars) is taken as raw entropy.
  string source_text = 2;
  // Words to produce: 12 or 24. Defaults to 12. With no entropy and no
  // source_text the server mints fresh entropy of this size.
  uint32 word_count = 3;
  string passphrase = 4;
}

message PreviewWalletFromEntropyResponse {
  // The entropy the words came from, hex encoded.
  string entropy_hex = 8;
  string mnemonic = 1;
  string seed_hex = 2;
  string master_key = 3;
  string chain_code = 4;
  // BIP39 entropy and checksum as bit strings, for the entropy breakdown.
  string bip39_binary = 5;
  string bip39_checksum = 6;
  string bip39_checksum_hex = 7;
}

message GetWalletSeedRequest {
  string wallet_id = 1;  // required; the wallet is always named
}

message GetWalletSeedResponse {
  string seed_hex = 1;
  // BIP39 mnemonic words for the wallet. Sensitive — treat like seed_hex.
  string mnemonic = 2;
}

