syntax = "proto3";

package stratum.v1;

import "google/protobuf/timestamp.proto";

// StratumService runs a Stratum v1 server for ASIC miners on the local
// network. The server sends their work to this node or to a pool, and keeps
// running with no client attached. eCash networks only.
service StratumService {
  rpc StartStratum(StartStratumRequest) returns (StartStratumResponse);
  rpc StopStratum(StopStratumRequest) returns (StopStratumResponse);
  rpc GetStratumStatus(GetStratumStatusRequest) returns (GetStratumStatusResponse);
  // SetTarget selects where the miners' work goes. A running server switches
  // at once and sends clean jobs.
  rpc SetTarget(SetTargetRequest) returns (SetTargetResponse);
  // ListTargets returns the catalog pools of the running network.
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse);
  // SetWorkMode changes the power mode of a connected miner over its device API.
  rpc SetWorkMode(SetWorkModeRequest) returns (SetWorkModeResponse);
  // SetMiningSettings changes the fields it carries and leaves the rest. The
  // hasher on this computer starts the server first when the server is stopped.
  rpc SetMiningSettings(SetMiningSettingsRequest) returns (SetMiningSettingsResponse);
  // GetHashrateHistory returns the hashrate of all miners together over a range.
  rpc GetHashrateHistory(GetHashrateHistoryRequest) returns (GetHashrateHistoryResponse);
  // ListPoolBlocks returns the blocks the upstream pool found, newest first.
  rpc ListPoolBlocks(ListPoolBlocksRequest) returns (ListPoolBlocksResponse);
}

message StartStratumRequest {
  // TCP port to listen on. Zero uses 3333.
  uint32 port = 1;
}

message StartStratumResponse {}

message StopStratumRequest {}

message StopStratumResponse {}

message GetStratumStatusRequest {}

enum TargetKind {
  TARGET_KIND_UNSPECIFIED = 0;
  // This node builds each block from its own template.
  TARGET_KIND_SOLO = 1;
  // A pool from the network catalog.
  TARGET_KIND_POOL = 2;
  // A Stratum pool the user typed in.
  TARGET_KIND_CUSTOM = 3;
}

message Target {
  TargetKind kind = 1;
  // Catalog pool id when kind is TARGET_KIND_POOL.
  string pool_id = 2;
  // stratum+tcp URL, worker and password when kind is TARGET_KIND_CUSTOM.
  string url = 3;
  string worker = 4;
  string password = 5;
}

enum WorkMode {
  WORK_MODE_UNSPECIFIED = 0;
  WORK_MODE_LOW = 1;
  WORK_MODE_MID = 2;
  WORK_MODE_HIGH = 3;
}

message MiningSettings {
  // TCP port the Stratum server listens on.
  uint32 port = 1;
  // Whether the hasher on this computer runs.
  bool cpu_mining = 2;
  // Hash threads the hasher runs.
  uint32 cpu_threads = 3;
  // Whether the miners keep going after the app window closes.
  bool keep_mining_on_close = 4;
}

message SetMiningSettingsRequest {
  optional uint32 port = 1;
  optional bool cpu_mining = 2;
  optional uint32 cpu_threads = 3;
  optional bool keep_mining_on_close = 4;
}

message SetMiningSettingsResponse {}

enum HashrateRange {
  HASHRATE_RANGE_UNSPECIFIED = 0;
  // One hour in one-minute buckets.
  HASHRATE_RANGE_HOUR = 1;
  // One day in ten-minute buckets.
  HASHRATE_RANGE_DAY = 2;
  // Seven days in one-hour buckets.
  HASHRATE_RANGE_WEEK = 3;
}

message HashratePoint {
  google.protobuf.Timestamp time = 1;
  // Hashes per second of all miners together over the bucket.
  double hashrate = 2;
}

message GetHashrateHistoryRequest {
  HashrateRange range = 1;
}

message GetHashrateHistoryResponse {
  // Oldest first. A bucket with no miner reads zero.
  repeated HashratePoint points = 1;
  // Highest bucket of the range.
  double peak = 2;
  // Hashrate right now.
  double current = 3;
}

message PoolBlock {
  uint32 height = 1;
  string hash = 2;
  // What the pool paid out for the block.
  int64 reward_sats = 3;
  int64 fee_sats = 4;
  // Worker name the pool credits.
  string finder = 5;
  // Sats the coinbase of the block pays to the payout address. Unset when
  // the local node does not give the block.
  optional int64 my_payout_sats = 6;
  // Whether a miner on this computer found the block.
  bool mine = 7;
  // Confirmations from the local node. Negative when the block left the main
  // chain. Unset when the node does not answer.
  optional int32 confirmations = 8;
  google.protobuf.Timestamp found_time = 9;
}

message ListPoolBlocksRequest {
  // Blocks to return. Zero returns 20.
  uint32 limit = 1;
}

message ListPoolBlocksResponse {
  repeated PoolBlock blocks = 1;
  // Why the list is empty, such as a pool that publishes no blocks. Empty
  // when the pool answered.
  string unavailable = 2;
}

message AcceptedShare {
  google.protobuf.Timestamp time = 1;
  string worker = 2;
  // Difficulty the share had to reach.
  double target = 3;
  // Difficulty the share reached.
  double actual = 4;
  string hash = 5;
  // Whether the share completed a block.
  bool block = 6;
}

message ConnectedMiner {
  string worker = 1;
  // IP address the miner connects from. The hasher on this computer reads
  // "this computer".
  string address = 2;
  // Hashes per second over the last five minutes.
  double hashrate = 3;
  double best_share = 4;
  uint64 accepted_shares = 5;
  uint64 rejected_shares = 6;
  // Unset until the miner sends a share.
  google.protobuf.Timestamp last_share_time = 7;
  // Values from the miner's device API. Unset when the device does not answer.
  optional double temperature_celsius = 8;
  optional double fan_percent = 9;
  optional double power_watts = 10;
  WorkMode work_mode = 11;
}

message FoundBlock {
  uint32 height = 1;
  string hash = 2;
  int64 reward_sats = 3;
  string worker = 4;
  google.protobuf.Timestamp found_time = 5;
  // Confirmations from the local node. Negative when the block left the main
  // chain. Unset when the node does not answer.
  optional int32 confirmations = 6;
}

message GetStratumStatusResponse {
  bool running = 1;
  uint32 port = 2;
  // stratum+tcp URL on the LAN IPv4 address of this machine. Empty when the
  // machine has no LAN address.
  string pool_url = 3;
  // Hashes per second of all miners together.
  double hashrate = 4;
  double best_share = 5;
  double network_difficulty = 6;
  // Blocks found since the server started, newest first.
  repeated FoundBlock blocks_found = 7;
  repeated ConnectedMiner miners = 8;
  // Why the server last stopped on its own. Empty after a clean stop.
  string error = 9;
  Target target = 10;
  // Upstream pool state. Both are empty for a solo target.
  bool pool_connected = 11;
  string pool_host = 12;
  // Wallet address that a mined block pays. The enforcer builds every
  // coinbase to it, and a catalog pool pays out to it.
  string payout_address = 13;
  uint64 accepted_shares = 14;
  uint64 rejected_shares = 15;
  MiningSettings settings = 16;
  // The last shares the server took, newest first.
  repeated AcceptedShare recent_shares = 17;
  // Hashes per second of the whole network, from the local node. Zero when
  // the node does not answer.
  double network_hashrate = 18;
}

message SetTargetRequest {
  Target target = 1;
}

message SetTargetResponse {}

message ListTargetsRequest {}

message CatalogPool {
  string id = 1;
  string name = 2;
  // stratum+tcp URL of the pool.
  string url = 3;
  // Fee as the catalog states it. Empty when the catalog states none.
  string fee = 4;
  // Hashes per second of the whole pool. Unset when the pool publishes none.
  optional double hashrate = 5;
}

message ListTargetsResponse {
  repeated CatalogPool pools = 1;
}

message SetWorkModeRequest {
  // Address of a connected miner, as GetStratumStatus reports it.
  string address = 1;
  WorkMode mode = 2;
}

message SetWorkModeResponse {}
