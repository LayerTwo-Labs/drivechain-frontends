syntax = "proto3";

package orchestrator.v1;

service OrchestratorService {
  // List all configured binaries and their status.
  rpc ListBinaries(ListBinariesRequest) returns (ListBinariesResponse);

  // Get the status of a single binary.
  rpc GetBinaryStatus(GetBinaryStatusRequest) returns (GetBinaryStatusResponse);

  // Resolve a binary's on-disk path the same way the launcher does (variant-
  // and test-build aware, honoring force_backend) and return its --version
  // output. The frontend must never re-derive the path or shell out itself;
  // this RPC is the single source of truth for "which binary, what version".
  rpc GetBinaryVersion(GetBinaryVersionRequest) returns (GetBinaryVersionResponse);

  // Download a binary with streaming progress.
  // Kicks off a download in a background goroutine and returns
  // immediately. Progress (MB downloaded / total, is_downloading) is
  // polled out of GetSyncStatus, never tied to this RPC's lifetime — so
  // a transport blip can't cancel an in-flight download.
  rpc DownloadBinary(DownloadBinaryRequest) returns (DownloadBinaryResponse);

  // Start a binary.
  rpc StartBinary(StartBinaryRequest) returns (StartBinaryResponse);

  // Stop a binary.
  rpc StopBinary(StopBinaryRequest) returns (StopBinaryResponse);

  // Stream stdout/stderr from a binary.
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);

  // Kick off a binary and its full L1 dependency chain (Core -> Enforcer ->
  // target). Fire-and-forget on the server: returns as soon as the boot
  // goroutine is dispatched. Callers poll GetSyncStatus / ListBinaries for
  // download progress and connection state — never tied to this RPC's
  // lifetime, so a transport blip can't kill an in-flight download.
  rpc StartWithL1(StartWithL1Request) returns (StartWithL1Response);

  // Stop the named binary and start it again, single-daemon scope. Never
  // touches sibling daemons: restarting "enforcer" never spawns or adopts
  // bitcoind. Use this for per-daemon "Restart" buttons on UI cards;
  // StartWithL1 stays the entry point for full-chain bootstrap. Same
  // fire-and-forget shape as StartWithL1.
  rpc RestartDaemon(RestartDaemonRequest) returns (RestartDaemonResponse);

  // Restart the whole L1 stack (bitcoind + enforcer) on the current config.
  // Stops both (a not-running daemon is skipped, never an error) then boots
  // the L1 chain via the same path as StartWithL1. Running sidechains are left
  // alone — they reconnect once the enforcer is back. Fire-and-forget: returns
  // as soon as the boot goroutine is dispatched. Use this for the "Restart
  // Bitcoin Core and Enforcer" UI flow instead of hand-sequencing stop/start.
  rpc RestartL1(RestartL1Request) returns (RestartL1Response);

  // Load a UTXO snapshot into the running Bitcoin Core. Streams download and
  // load progress; a snapshot Core refuses (its base block already passed, or
  // a snapshot already loaded in this datadir) comes back as an error carrying
  // Core's own message. Nothing is stopped, restarted or deleted.
  rpc ApplyUTXOSnapshot(ApplyUTXOSnapshotRequest) returns (stream ApplyUTXOSnapshotResponse);

  // The UTXO snapshot published for the active network (from the network
  // catalog) plus the one currently loaded in Bitcoin Core, if any. Feeds the
  // settings UI: pre-fills the snapshot field and shows what is loaded.
  rpc GetSnapshotStatus(GetSnapshotStatusRequest) returns (GetSnapshotStatusResponse);

  // The eCash network published but not switched to yet. Feeds the upgrade
  // prompt; pending_network_id is empty when already on the newest one.
  rpc GetPendingNetworkGeneration(GetPendingNetworkGenerationRequest) returns (GetPendingNetworkGenerationResponse);

  // Record the user's go-ahead to switch to the published eCash network.
  // Nothing is stopped or deleted here: the caller must restart the backends,
  // and the switch runs on the next start. Wallets survive, chain history and
  // its transactions do not — only call with the user's confirmation.
  rpc ConfirmPendingNetworkGeneration(ConfirmPendingNetworkGenerationRequest) returns (ConfirmPendingNetworkGenerationResponse);

  // Shutdown all running binaries.
  rpc ShutdownAll(ShutdownAllRequest) returns (stream ShutdownAllResponse);

  // Detached-daemon shutdown. bitwindowd calls this on window close;
  // orchestratord acks immediately, drains its children (bitcoind, enforcer,
  // sidechains) in a background goroutine, and os.Exit(0)s when done.
  // Idempotent. If bitwindow is relaunched while the drain is still in
  // flight, the next StartWithL1 transparently adopts it (flips the
  // will-exit bit + awaits the in-flight stops) before booting a fresh
  // stack — no separate cancel/await RPCs needed by callers.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // Get the current BTC/USD exchange rate.
  rpc GetBTCPrice(GetBTCPriceRequest) returns (GetBTCPriceResponse);

  // Get blockchain info from Bitcoin Core (proxied via orchestrator).
  rpc GetMainchainBlockchainInfo(GetMainchainBlockchainInfoRequest) returns (GetMainchainBlockchainInfoResponse);

  // Get blockchain info from the enforcer (proxied via orchestrator).
  rpc GetEnforcerBlockchainInfo(GetEnforcerBlockchainInfoRequest) returns (GetEnforcerBlockchainInfoResponse);

  // One-shot snapshot of mainchain + enforcer + bitwindow daemon sync state.
  // Backend fans out to all three in parallel so the three numbers are taken
  // at the same wall-clock instant — no two cards in the UI can ever disagree.
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse);

  // Snapshot of every binary the orchestrator is currently downloading.
  // Reads from the in-memory DownloadManager state — light, polled by the
  // frontend's DownloadProvider on a fast (100ms) cadence while a download
  // is in flight, and dropping back to 2s when the response is empty.
  rpc GetDownloadStatus(GetDownloadStatusRequest) returns (GetDownloadStatusResponse);

  // Get wallet balance from Bitcoin Core (proxied via orchestrator).
  rpc GetMainchainBalance(GetMainchainBalanceRequest) returns (GetMainchainBalanceResponse);

  // Get wallet balance from a sidechain daemon (proxied via orchestrator).
  rpc GetSidechainBalance(GetSidechainBalanceRequest) returns (GetSidechainBalanceResponse);

  // Gather the files/dirs that would be deleted for a per-binary deletion spec
  // (no side effects). Shared by the single-binary wipe and the full reset page.
  rpc GatherFilesToDelete(GatherFilesToDeleteRequest) returns (GatherFilesToDeleteResponse);

  // Delete the selected files. Stops binaries first; wallet paths are moved to
  // wallet_backups/ instead of removed. Returns a gRPC error if it can't run.
  // Streams one message per path; an unset error means that path succeeded.
  rpc DeleteFiles(DeleteFilesRequest) returns (stream DeleteFilesResponse);

  // Drop a block Core must not follow. Core rejects it and every block above
  // it, then follows the best remaining valid branch.
  rpc RejectBlock(RejectBlockRequest) returns (RejectBlockResponse);

  // Undo RejectBlock. Core re-checks the block and its branch, and follows it
  // again when it has the most work.
  rpc AcceptBlock(AcceptBlockRequest) returns (AcceptBlockResponse);

  // Move the chain back to a block, then sync forward to the tip again. Core
  // drops the block and every block above it, then re-validates them from
  // disk. Streams one message per phase.
  rpc ResetToBlock(ResetToBlockRequest) returns (stream ResetToBlockResponse);

  // ─── Bitcoin Core typed extensions ────────────────────────────────────────
  // Sit alongside the btc-buf BitcoinService for methods btc-buf doesn't type
  // (getmempoolinfo) plus a generic raw-call escape hatch (finalizepsbt,
  // descriptorprocesspsbt, …). Frontends prefer the typed btc-buf methods
  // when available.

  // Full bitcoind getmempoolinfo response. Distinct from getrawmempool.
  rpc GetCoreMempoolInfo(GetCoreMempoolInfoRequest) returns (GetCoreMempoolInfoResponse);

  // Parent-chain state the sidechain BMM tab bids against: the tip a request
  // targets, the fee rate it competes with, mempool depth.
  rpc GetBmmContext(GetBmmContextRequest) returns (GetBmmContextResponse);

  // Generic raw bitcoind RPC. Optional `wallet` field routes the call to
  // /wallet/{name} on bitcoind for wallet-scoped RPCs.
  rpc CoreRawCall(CoreRawCallRequest) returns (CoreRawCallResponse);

  // ─── eCash fork ───────────────────────────────────────────────────────────
  // Report where the mainchain tip sits relative to the eCash fork height.
  // The orchestrator is the single source of truth for the fork height; the
  // frontend renders "fork mode" (the claim card) off fork_active. Per-wallet
  // pre-fork coin detection and the sweep itself stay in the frontend via the
  // existing WalletManagerService (listUnspent / sendTransaction), one call
  // per wallet — this RPC only supplies the height.
  rpc GetForkStatus(GetForkStatusRequest) returns (GetForkStatusResponse);
}

message BinaryStatusMsg {
  string name = 1;
  string display_name = 2;
  bool running = 3;
  bool healthy = 4;
  int32 pid = 5;
  int64 uptime_seconds = 6;
  int32 chain_layer = 7;
  int32 port = 8;
  string error = 9;
  bool connected = 10;
  string startup_error = 11;    // warmup message (e.g. "Loading block index...")
  string connection_error = 12; // real connection error
  bool stopping = 13;           // binary is being stopped
  bool initializing = 14;       // binary is starting up / restarting
  bool connect_mode_only = 15;  // willfully stopped, only watching for external restart
  bool downloadable = 16;       // binary has download URLs configured
  string description = 17;      // short description of the binary
  bool downloaded = 18;         // binary file exists on disk
  bool port_in_use = 19;       // port is reachable but not managed by orchestrator
  string version = 20;         // configured version string
  string repo_url = 21;        // source code repository URL
  repeated StartupLogEntryMsg startup_logs = 22; // recent startup progress messages
  // Absolute path to the download this request selects (variant-aware: returns
  // bin/test/<binary>/... for a sidechain frontend, the resolved
  // .app/Contents/MacOS path on macOS, etc.). force_backend picks the daemon
  // instead. Empty when that download is not on disk.
  string binary_path = 23;
  // A newer build is published than the one on disk. False while either side
  // is unknown, so a failed check never claims an update.
  bool update_available = 24;
  // Last-Modified of the published download, 0 when unknown.
  int64 remote_timestamp_unix = 25;
  // Modification time of the binary on disk, 0 when not downloaded.
  int64 downloaded_timestamp_unix = 26;
}

message StartupLogEntryMsg {
  int64 timestamp_unix = 1;
  string message = 2;
}

// ListBinaries

message ListBinariesRequest {
  // Same lever as launch: when true, skip the UseTestSidechains resolver and
  // report the prod backend for every layer-2 binary.
  bool force_backend = 1;
}

message ListBinariesResponse {
  repeated BinaryStatusMsg binaries = 1;
}

// GetBinaryStatus

message GetBinaryStatusRequest {
  string name = 1;
  // Same lever as launch: when true, skip the UseTestSidechains resolver and
  // report the prod backend.
  bool force_backend = 2;
}

message GetBinaryStatusResponse {
  BinaryStatusMsg status = 1;
}

// GetBinaryVersion

message GetBinaryVersionRequest {
  string name = 1;
  // Same lever as launch: when true, skip the UseTestSidechains resolver and
  // resolve the prod (Rust) backend. Sidechain callers pass true so the modal
  // reports the real node version, not the Flutter test build (which has no
  // --version).
  bool force_backend = 2;
}

message GetBinaryVersionResponse {
  string version = 1;      // parsed --version output, or an error/status string
  string binary_path = 2;  // the path that was actually resolved + run
  bool is_test_build = 3;  // resolved a Flutter test build (no --version available)
}

// DownloadBinary

message DownloadBinaryRequest {
  string name = 1;
  bool force = 2;
  // Download the daemon, never the sidechain's Flutter bundle. Sidechain apps
  // set this so an update installs the backend they actually run.
  bool force_backend = 3;
}

message DownloadBinaryResponse {}

// StartBinary

message StartBinaryRequest {
  string name = 1;
  repeated string extra_args = 2;
  map<string, string> env = 3;
}

message StartBinaryResponse {
  int32 pid = 1;
}

// StopBinary

message StopBinaryRequest {
  string name = 1;
  bool force = 2;
  bool force_backend = 3;
}

message StopBinaryResponse {}

// StreamLogs

message StreamLogsRequest {
  string name = 1;
  int32 tail = 2; // number of recent lines to include
}

message StreamLogsResponse {
  string stream = 1; // "stdout" or "stderr"
  string line = 2;
  int64 timestamp_unix = 3;
}

// StartWithL1

message StartWithL1Request {
  string target = 1;
  repeated string target_args = 2;
  map<string, string> target_env = 3;
  repeated string core_args = 4;
  repeated string enforcer_args = 5;
  bool immediate = 6;
  // Bypass UseTestSidechains for this call: always launch the prod-download
  // binary even if the user toggled "Use test sidechains" on. Sidechain
  // Flutter apps set this when self-booting their backend so the toggle
  // doesn't re-spawn another Flutter bundle inside them.
  bool force_backend = 7;
}

message StartWithL1Response {}

// RestartDaemon

message RestartDaemonRequest {
  string name = 1;
  // Restart only the daemon, never the sidechain's Flutter bundle. A stopped
  // daemon keeps no boot mode to recover, so the caller states it.
  bool force_backend = 2;
}

message RestartDaemonResponse {}

// RestartL1

message RestartL1Request {}

message RestartL1Response {}

// ApplyUTXOSnapshot

message ApplyUTXOSnapshotRequest {
  // Exactly one of url or path. url is downloaded; path is a file the user
  // already has on disk and is left in place afterwards.
  string url = 1;
  string path = 2;
  // Expected sha256 of the snapshot, lowercase hex. Optional — empty loads the
  // snapshot unverified, which is the normal case for a user-supplied file.
  string sha256 = 3;
}

message ApplyUTXOSnapshotResponse {
  // Human-readable status, e.g. "downloading UTXO snapshot... 42%".
  string message = 1;
  // Download completion, 0-100. Zero while no download is in flight — the
  // load phase itself reports no percentage, because Core blocks until the
  // whole snapshot is read and exposes no completion fraction.
  int32 download_percent = 2;
  // Set once Core has accepted and finished loading the snapshot.
  bool done = 3;
}

// GetSnapshotStatus

message GetSnapshotStatusRequest {}

message GetSnapshotStatusResponse {
  // The snapshot the active network publishes, empty url when none. Used to
  // pre-fill the snapshot field in settings.
  string available_url = 1;
  int64 available_height = 2;
  string available_sha256 = 3;

  // The snapshot currently loaded in Bitcoin Core, from getchainstates.
  bool has_active_snapshot = 4;
  string active_blockhash = 5;
  int64 active_height = 6;
  // Set once Core has fully validated the snapshot chainstate from genesis.
  bool active_validated = 7;
  double active_verification_progress = 8;
}

// GetPendingNetworkGeneration

message GetPendingNetworkGenerationRequest {}

message GetPendingNetworkGenerationResponse {
  // The eCash network this install runs now, and the newer one published,
  // empty when already current.
  string current_network_id = 1;
  string pending_network_id = 2;

  // The new network's UTXO snapshot, which the switch syncs from. Zero height
  // means none is published.
  int64 snapshot_height = 3;
  int64 snapshot_size_bytes = 4;

  // The new network's seed node, for the manual switch instructions.
  string pending_peer = 5;

  // True when the user's own bitcoin.conf names the network. The switch cannot
  // be made here — the prompt spells out what to change instead.
  bool user_managed_conf = 6;
}

// ConfirmPendingNetworkGeneration

message ConfirmPendingNetworkGenerationRequest {}

message ConfirmPendingNetworkGenerationResponse {}

// ShutdownAll

message ShutdownAllRequest {
  bool force = 1;
}

message ShutdownAllResponse {
  int32 total_count = 1;
  int32 completed_count = 2;
  string current_binary = 3;
  bool done = 4;
  string error = 5;
}

// GetBTCPrice

message GetBTCPriceRequest {}

message GetBTCPriceResponse {
  double btcusd = 1;
  int64 last_updated_unix = 2;
}

// GetMainchainBlockchainInfo

message GetMainchainBlockchainInfoRequest {}

message GetMainchainBlockchainInfoResponse {
  string chain = 1;
  int32 blocks = 2;
  int32 headers = 3;
  string best_block_hash = 4;
  double difficulty = 5;
  int64 time = 6;
  int64 median_time = 7;
  double verification_progress = 8;
  bool initial_block_download = 9;
  string chain_work = 10;
  int64 size_on_disk = 11;
  bool pruned = 12;
}

// GetEnforcerBlockchainInfo

message GetEnforcerBlockchainInfoRequest {}

message GetEnforcerBlockchainInfoResponse {
  int32 blocks = 1;
  int32 headers = 2;
  int64 time = 3;
}

// GetSyncStatus
//
// Atomic snapshot of mainchain + enforcer sync state, plus optionally a
// caller-specified sidechain (bitwindow, thunder, zside, bitnames,
// bitassets, photon, truthcoin, coinshift). The orchestrator fans out
// concurrently and returns a combined result. A daemon that isn't
// reachable returns its `ChainSync` zero-valued with an `error` string.

message GetSyncStatusRequest {}

message GetSyncStatusResponse {
  ChainSync mainchain = 1;                   // bitcoind
  ChainSync enforcer = 2;                    // BIP300/301 enforcer
  // All sidechains the orchestrator knows about. Always includes every
  // configured sidechain — daemons that aren't running yet appear with
  // their `sync.error` set so the UI can render a placeholder. While a
  // sidechain is downloading, its sync.is_downloading is true and
  // blocks/headers are MB downloaded / MB total.
  repeated SidechainStatus sidechains = 3;
  // Non-empty while the active electrum wallet is scanning, e.g.
  // "Scanning external addresses — 12 checked, 3 used". The bottom-nav sync
  // display shows it alongside daemon sync status.
  string wallet_sync_status = 4;
  reserved 5;
  reserved "enforcer_wallet";
  // Tip the wallet chain source reports (esplora or electrum). An electrum
  // wallet runs no local node, so this is the only height it has.
  ChainSync chain_source = 6;
}

// SidechainType keeps the response strongly-typed so callers don't have to
// match magic strings. UNSPECIFIED is reserved for forwards-compat — when
// a frontend sees it, the binary is known to the orchestrator but doesn't
// have a typed enum value yet.
enum SidechainType {
  SIDECHAIN_TYPE_UNSPECIFIED = 0;
  SIDECHAIN_TYPE_THUNDER = 1;
  SIDECHAIN_TYPE_ZSIDE = 2;
  SIDECHAIN_TYPE_BITNAMES = 3;
  SIDECHAIN_TYPE_BITASSETS = 4;
  SIDECHAIN_TYPE_TRUTHCOIN = 5;
  SIDECHAIN_TYPE_PHOTON = 6;
  SIDECHAIN_TYPE_COINSHIFT = 7;
}

// BinaryType is the single typed identifier for any binary the system tracks.
// Used wire-side by the orchestrator and consumed directly by the Flutter
// frontends — there is no parallel Dart enum. UNSPECIFIED is reserved for
// forwards-compat: when a frontend sees it, the binary is known to the
// orchestrator but doesn't have a typed enum value yet.
enum BinaryType {
  BINARY_TYPE_UNSPECIFIED = 0;
  BINARY_TYPE_BITCOIND = 1;
  BINARY_TYPE_ENFORCER = 2;
  BINARY_TYPE_BITWINDOWD = 3;
  BINARY_TYPE_THUNDER = 4;
  BINARY_TYPE_ZSIDE = 5;
  BINARY_TYPE_BITNAMES = 6;
  BINARY_TYPE_BITASSETS = 7;
  BINARY_TYPE_TRUTHCOIN = 8;
  BINARY_TYPE_PHOTON = 9;
  BINARY_TYPE_COINSHIFT = 10;
  BINARY_TYPE_GRPCURL = 11;
  BINARY_TYPE_ORCHESTRATORD = 12;
  BINARY_TYPE_ZSIDED = 13;
  BINARY_TYPE_LIQUID_SIGNET = 14;
  BINARY_TYPE_INQUISITION = 15;
}

message SidechainStatus {
  SidechainType type = 1;
  ChainSync sync = 2;
}

message ChainSync {
  // Current tip height for the chain.
  int32 blocks = 1;
  // bitcoind's header count, or this daemon's own headers if mainchain is
  // unavailable.
  int32 headers = 2;
  // Block tip timestamp (unix seconds), 0 if no tip yet.
  int64 time = 3;
  // Empty on success; otherwise a short description of why this daemon's
  // sync info isn't available (not running, RPC error, etc.).
  string error = 4;
  // Highest tip the node's peers announce, 0 when unknown. Mainchain only.
  int32 peer_best_height = 5;
  // True when the node marked a branch at or above its own tip invalid.
  // With a higher peer_best_height it means the node left the network's
  // chain, which blocks and headers alone never show. Mainchain only.
  bool rejected_branch = 6;
  // Where the refused branch leaves this node's chain, 0 when the node
  // refuses none. The invalid block sits at or above it. Mainchain only.
  int32 refused_branch_start = 7;
}

// GetDownloadStatus
//
// Snapshot of the orchestrator's live download tracking. Returns one entry
// per binary that is currently being fetched. A daemon that is not in flight
// is omitted entirely — the empty list is the steady state.

message GetDownloadStatusRequest {}

message GetDownloadStatusResponse {
  repeated DownloadStatus downloads = 1;
}

message DownloadStatus {
  // Typed identifier for the binary being downloaded.
  BinaryType binary = 1;
  // Megabytes downloaded so far. Source of truth lives in DownloadManager.
  int64 mb_downloaded = 2;
  // Total size in megabytes, or -1 when the server hasn't reported a
  // Content-Length yet.
  int64 mb_total = 3;
  // Optional human-readable progress string ("verifying hash", ...).
  string message = 4;
}

// GetMainchainBalance

message GetMainchainBalanceRequest {}

message GetMainchainBalanceResponse {
  double confirmed = 1;
  double unconfirmed = 2;
}

// GetSidechainBalance

message GetSidechainBalanceRequest {
  BinaryType sidechain = 1;
}

message GetSidechainBalanceResponse {
  uint64 confirmed_sats = 1;
  uint64 pending_sats = 2;
}

// GatherFilesToDelete

// DeletionType selects which category of a binary's files to gather/delete.
enum DeletionType {
  DELETION_TYPE_UNSPECIFIED = 0;
  DELETION_TYPE_DATA = 1;     // blockchain data
  DELETION_TYPE_WALLET = 2;   // wallet files (moved to wallet_backups/ on delete)
  DELETION_TYPE_SETTINGS = 3; // config / settings files
  DELETION_TYPE_LOGS = 4;     // log files
  DELETION_TYPE_SOFTWARE = 5; // downloaded binary / node software
}

// One binary plus the categories of its data to act on.
message SingleDeletion {
  BinaryType binary = 1;
  repeated DeletionType deletions = 2;
}

message GatherFilesToDeleteRequest {
  repeated SingleDeletion items = 1;
}

message GatherFilesToDeleteResponse {
  repeated ResetFileInfo files = 1;
}

message ResetFileInfo {
  string path = 1;
  DeletionType deletion_type = 2;
  BinaryType binary = 3;
  int64 size_bytes = 4;
  bool is_directory = 5;
}

// DeleteFiles

message DeleteFilesRequest {
  // What to delete: the same per-binary categories passed to GatherFilesToDelete.
  repeated SingleDeletion items = 1;
  // Paths to omit from the deletion, e.g. files the user deselected.
  repeated string except = 2;
}

message DeleteFilesResponse {
  string path = 1;
  string error = 2; // unset → this path was deleted successfully
}

message RejectBlockRequest {
  // Hash of the block Core must not follow. Core drops it and every block
  // above it. A height names no block when two branches share it, so the
  // hash is the only way to say which one.
  string block_hash = 1;
  // How long to wait for the enforcer to follow before its validator chain
  // is deleted. Zero picks the default.
  uint32 enforcer_wait_seconds = 2;
}

// What the reject did to the chain Core follows.
enum RejectOutcome {
  REJECT_OUTCOME_UNSPECIFIED = 0;
  // Core dropped the block and followed another branch.
  REJECT_OUTCOME_SWITCHED_BRANCH = 1;
  // Core dropped the block and parked on its parent, with no branch to take.
  REJECT_OUTCOME_PARKED_ON_PARENT = 2;
  // The block already sat off the active chain, so the tip did not move.
  REJECT_OUTCOME_ALREADY_INACTIVE = 3;
}

message RejectBlockResponse {
  // Core's tip after the reject.
  uint32 core_height = 1;
  // Hash of that tip.
  string core_tip_hash = 2;
  // What the reject did to the chain Core follows.
  RejectOutcome outcome = 3;
  // The enforcer's tip afterwards. Zero when the enforcer is stopped.
  uint32 enforcer_height = 4;
  // True when the enforcer did not follow, so its validator chain was deleted
  // and it now rebuilds from the local Core.
  bool enforcer_rebuilt = 5;
  // Empty on success; otherwise why the enforcer could not be brought back
  // onto Core's chain. Core already moved, so the caller keeps its undo path.
  string enforcer_error = 6;
  // False when the enforcer was never asked, so enforcer_height carries no
  // reading and must not be shown as one.
  bool enforcer_checked = 7;
}

message AcceptBlockRequest {
  // Hash of a block rejected earlier. Core clears the mark on it, on its
  // ancestors, and on its descendants.
  string block_hash = 1;
  // How long to wait for the enforcer to follow before its validator chain
  // is deleted. Zero picks the default.
  uint32 enforcer_wait_seconds = 2;
}

message AcceptBlockResponse {
  // Core's tip after the block is accepted again.
  uint32 core_height = 1;
  // Hash of that tip.
  string core_tip_hash = 2;
  // The enforcer's tip afterwards. Zero when the enforcer is stopped.
  uint32 enforcer_height = 3;
  // True when the enforcer did not follow, so its validator chain was deleted
  // and it now rebuilds from the local Core.
  bool enforcer_rebuilt = 4;
  // Empty on success; otherwise why the enforcer could not be brought back
  // onto Core's chain. Core already moved, so the caller keeps its undo path.
  string enforcer_error = 5;
  // False when the enforcer was never asked, so enforcer_height carries no
  // reading and must not be shown as one.
  bool enforcer_checked = 6;
}

message ResetToBlockRequest {
  // The block to move back to. A 64-character hash names one block. Anything
  // else reads as a decimal height, and a height resolves against the chain
  // this node follows today.
  string target = 1;
  // How long to wait for the enforcer to follow before its validator chain is
  // deleted. Zero picks the default.
  uint32 enforcer_wait_seconds = 2;
}

// Which step of a reset a progress message reports.
enum ResetPhase {
  RESET_PHASE_UNSPECIFIED = 0;
  // The target reads as a height or a hash, and Core holds the block.
  RESET_PHASE_RESOLVE = 1;
  // Core drops the target block and every block above it.
  RESET_PHASE_MOVE_BACK = 2;
  // Core re-validates the dropped blocks from disk and climbs to the old tip.
  RESET_PHASE_SYNC_FORWARD = 3;
  // The enforcer comes back onto the chain Core follows.
  RESET_PHASE_ENFORCER = 4;
  // The reset is over.
  RESET_PHASE_DONE = 5;
}

message ResetToBlockResponse {
  ResetPhase phase = 1;
  // Human-readable status for the phase.
  string message = 2;
  // The block the reset moves back to.
  uint32 target_height = 3;
  string target_hash = 4;
  // Core's tip as the phase reports it. It falls to target_height - 1 on the
  // move back, then climbs again.
  uint32 core_height = 5;
  // Core's tip before the reset. The replay ends here.
  uint32 tip_height = 6;
  // Blocks re-validated so far, out of the blocks the reset drops.
  uint32 blocks_done = 7;
  uint32 blocks_total = 8;
  // The enforcer's tip afterwards. Zero when the enforcer is stopped.
  uint32 enforcer_height = 9;
  // False when the enforcer was never asked, so enforcer_height carries no
  // reading and must not be shown as one.
  bool enforcer_checked = 10;
  // True when the enforcer did not follow, so its validator chain was deleted
  // and it rebuilds from the local Core.
  bool enforcer_rebuilt = 11;
  // Empty on success; otherwise why the enforcer could not be brought back
  // onto Core's chain.
  string enforcer_error = 12;
  // Set on the last message.
  bool done = 13;
}

// ─── Bitcoin Core typed extensions ────────────────────────────────────────

message GetCoreMempoolInfoRequest {}

// Mirrors bitcoind's getmempoolinfo. Aggregate stats — distinct from
// getrawmempool which lists individual mempool txids.
message GetCoreMempoolInfoResponse {
  bool loaded = 1;
  // Number of transactions in the mempool.
  int64 size = 2;
  // Sum of serialized sizes (bytes).
  int64 bytes = 3;
  // Total memory usage (bytes).
  int64 usage = 4;
  // Sum of all tx fees (BTC).
  double total_fee = 5;
  // Mempool size cap (bytes).
  int64 max_mempool = 6;
  // Lowest fee rate accepted into mempool (BTC/kvB).
  double mempool_min_fee = 7;
  // Lowest fee rate eligible for relay (BTC/kvB).
  double min_relay_tx_fee = 8;
  // Minimum bump-fee increment (BTC/kvB).
  double incremental_relay_fee = 9;
  // Transactions in mempool not yet broadcast.
  int64 unbroadcast_count = 10;
  bool full_rbf = 11;
}

message GetBmmContextRequest {}

// Parent-chain state a BMM miner bids against. A sidechain block only
// connects when a mainchain miner includes its commitment, so the tip is
// the block the next request targets and the fee rate is what the bid
// competes with. fee_rate_sat_vb is 0 when bitcoind cannot yet estimate.
message GetBmmContextResponse {
  int32 mainchain_height = 1;
  string mainchain_tip = 2;
  // Fee rate for confirmation in the next block, sat/vB.
  double fee_rate_sat_vb = 3;
  int64 mempool_txns = 4;
  string warnings = 5;
}

message CoreRawCallRequest {
  // bitcoind RPC method name (e.g. "finalizepsbt").
  string method = 1;
  // JSON-encoded positional params array (e.g. '["psbtBase64", false]').
  // Empty string means no params.
  string params_json = 2;
  // Optional bitcoind wallet name to scope the call to. When set, the request
  // is routed to /wallet/{wallet} on bitcoind so wallet-scoped RPCs like
  // listtransactions / getbalance / getwalletinfo dispatch to the right
  // wallet. Empty = node-level call.
  string wallet = 3;
}

message CoreRawCallResponse {
  // JSON-encoded result. Caller decodes to its expected shape.
  string result_json = 1;
}

// ─── eCash fork ─────────────────────────────────────────────────────────────

message GetForkStatusRequest {}

// Canonical fork snapshot produced by the orchestrator's single ForkEngine.
// The frontend renders this verbatim — it does no fork math of its own.
message GetForkStatusResponse {
  // Next fork height (countdown target). Fixed per network, or the next
  // 144-block boundary on signet's simulated daily fork.
  int32 fork_height = 1;
  // Current mainchain tip height.
  int32 current_height = 2;
  reserved 3; // was fork_active
  // Current mainchain header height. Runs ahead of `current_height` during
  // sync; the time-to-fork countdown is driven off this.
  int32 current_headers = 4;
  // Coins confirmed at/before this height are claimable. Equals fork_height on
  // fixed-height networks; the last 144-boundary on signet.
  int32 claim_boundary = 5;
  // True on signet, where the fork recurs every 144 blocks.
  bool simulated = 6;
  // Any wallet holds un-swept pre-fork coins.
  bool has_funds_to_claim = 7;
  // Whether to show the next-fork countdown. False while coins are unclaimed
  // (claim-before-countdown).
  bool show_countdown = 8;
  // Per-wallet claimable coins, with the exact UTXOs the sweep spends.
  repeated ForkWalletClaim claims = 9;
  // Name of the fork being counted down to ("Alphanet"), from the published
  // catalog. A rehearsal must never read as the real eCash fork.
  string network_name = 10;
}

message ForkWalletClaim {
  string wallet_id = 1;
  string wallet_name = 2;
  uint64 claimable_sats = 3;
  repeated ForkClaimUtxo utxos = 4;
  reserved 5;
  reserved "replay_protectable";
}

message ForkClaimUtxo {
  string outpoint = 1; // "txid:vout"
  string address = 2;
  uint64 sats = 3;
  string label = 4;
  // True when the outpoint exists unspent on BTC mainnet. Unset until the
  // split engine checked it.
  optional bool splittable = 5;
  // Confirmation block height.
  int32 height = 6;
}

// ─── Detached-daemon lifecycle ──────────────────────────────────────────────

message ShutdownRequest {
  // Drain only once no client is connected and the owner process is gone.
  // Unset means drain now, whoever else is attached.
  bool only_if_last = 1;
}
message ShutdownResponse {}
