syntax = "proto3";

package orchestrator.v1;

service BitcoinConfService {
  // Get current Bitcoin Core configuration state.
  rpc GetBitcoinConfig(GetBitcoinConfigRequest) returns (GetBitcoinConfigResponse);

  // Report what the user must resolve before a network and/or wallet-backend
  // change can be applied. Side-effect free.
  rpc PrepareNetworkChange(PrepareNetworkChangeRequest) returns (NetworkChangePlan);

  // The networks the user can pick, from the published catalog plus regtest.
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);

  // The networks that appeared in the catalog since the last call, so the app
  // can name them in a notice. Reporting a network also marks it told: a
  // second call returns it no more. A first run reports nothing.
  rpc TakeNewNetworks(TakeNewNetworksRequest) returns (TakeNewNetworksResponse);

  // What a move to another eCash network costs. Both fork mainnet, so the
  // blocks below the lower fork height are shared and the move is a reset
  // rather than a resync. Side-effect free.
  rpc PlanECashSwitch(PlanECashSwitchRequest) returns (PlanECashSwitchResponse);

  // Set the Bitcoin Core network. Takes a catalog id ("alphanet") or a slot
  // name (signet, mainnet, forknet, ecash, regtest).
  rpc SetBitcoinConfigNetwork(SetBitcoinConfigNetworkRequest) returns (SetBitcoinConfigNetworkResponse);

  // Set the Bitcoin Core datadir for a specific network.
  rpc SetBitcoinConfigDataDir(SetBitcoinConfigDataDirRequest) returns (SetBitcoinConfigDataDirResponse);

  // Write raw Bitcoin Core configuration content.
  rpc WriteBitcoinConfig(WriteBitcoinConfigRequest) returns (WriteBitcoinConfigResponse);
}

// GetBitcoinConfig

message GetBitcoinConfigRequest {}

message GetBitcoinConfigResponse {
  string network = 1; // signet, mainnet, forknet, ecash, testnet, regtest
  int32 rpc_port = 2;
  bool has_private_conf = 3; // true if user has their own bitcoin.conf
  string config_path = 4; // path to the active config file
  string detected_data_dir = 5; // datadir from config (if set)
  string config_content = 6; // raw config file content
  bool network_supports_sidechains = 7;
  bool is_demo_mode = 8; // true on mainnet
  // RPC creds — exposed so localhost callers (cpuminer, future tools) that
  // need raw bitcoind JSON-RPC can dial it without re-parsing config_content.
  // Prefer the hosted BitcoinService proxy when possible.
  string rpc_user = 9;
  string rpc_password = 10;
  // Per-group datadir snapshots. The active group's value mirrors
  // detected_data_dir; the inactive group's value is the path that will be
  // restored on the next swap into that group. Empty = no path stored.
  string default_datadir = 11;
  string forknet_datadir = 12;
  string ecash_datadir = 13;
  // Live eCash network id ("alphanet").
  string ecash_network_id = 14;
  // True when the current network and wallet backend need a datadir the user
  // has not chosen yet. Drives the boot-time prompt.
  bool must_select_datadir = 15;
  // Esplora base URL the catalog publishes for the live eCash network, empty
  // when it publishes none.
  string ecash_esplora_url = 16;
  // Explorer host the catalog publishes for the live eCash network, empty
  // when it publishes none.
  string ecash_explorer_host = 17;
}

// ListNetworks

message ListNetworksRequest {}

// NetworkOption is one row of the network picker.
message NetworkOption {
  // Catalog id ("alphanet", "bitcoin"), or "regtest" for the local-only row.
  string id = 1;
  // Name to show the user ("Alphanet").
  string display_name = 2;
  // Slot this row runs in: mainnet | signet | forknet | ecash | regtest.
  string network = 3;
  // True for the network this install runs right now.
  bool is_current = 4;
}

message ListNetworksResponse {
  repeated NetworkOption networks = 1;
}

// PlanECashSwitch

message PlanECashSwitchRequest {
  string network_id = 1; // catalog id to move to
}

message PlanECashSwitchResponse {
  string from_id = 1;
  string to_id = 2;
  // Block the switch drops, one below the lower fork height. Core parks under
  // it and follows the new network from there. Zero when nothing is dropped.
  uint32 rewind_height = 3;
  bool needs_rollback = 4;
}

// TakeNewNetworks

message TakeNewNetworksRequest {}

message TakeNewNetworksResponse {
  repeated NetworkOption networks = 1;
}

// PrepareNetworkChange

// WalletBackend is what serves the wallet's chain data.
enum WalletBackend {
  WALLET_BACKEND_UNSPECIFIED = 0; // keep the current backend
  WALLET_BACKEND_ELECTRUM = 1;
  WALLET_BACKEND_CORE = 2;
  WALLET_BACKEND_ENFORCER = 3;
}

message PrepareNetworkChangeRequest {
  string network = 1; // empty keeps the current network
  WalletBackend wallet_backend = 2; // UNSPECIFIED keeps the current backend
  string wallet_id = 3; // wallet being switched to, if any; sets wallet_backend
}

// NetworkChangePlan is what the change would require. Prepare returns it for
// the frontend to resolve; apply re-runs it and refuses anything unresolved.
message NetworkChangePlan {
  string network = 1;
  WalletBackend wallet_backend = 2;
  bool must_select_datadir = 3;
  string datadir = 4; // the path that would be used, empty when unset
  string datadir_group = 5; // default | forknet | ecash
  bool needs_local_backends = 6; // false for electrum — nothing is downloaded
  bool implies_chain_download = 7;
  repeated string missing_binaries = 8;
  bool needs_binary_download = 9;
  bool no_op = 10; // nothing would change
}

// SetBitcoinConfigNetwork

message SetBitcoinConfigNetworkRequest {
  string network = 1; // signet, mainnet, forknet, ecash, testnet, regtest
  string data_dir = 2; // the user's answer to must_select_datadir, if asked
}

message SetBitcoinConfigNetworkResponse {
  NetworkChangePlan applied = 1;
}

// SetBitcoinConfigDataDir

message SetBitcoinConfigDataDirRequest {
  string data_dir = 1; // absolute path, empty to clear
  string network = 2; // target network (defaults to current if empty)
}

message SetBitcoinConfigDataDirResponse {}

// WriteBitcoinConfig

message WriteBitcoinConfigRequest {
  string config_content = 1;
}

message WriteBitcoinConfigResponse {}
