name: Integration Tests

on:
  pull_request:
    paths:
      - "sidechain-orchestrator/**"
      - "bitwindow/server/**"
      - ".github/workflows/integration.yml"

env:
  GO_VERSION: "1.25"

jobs:
  bitwindow-backend-smoke:
    name: bitwindow backend smoke
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ env.GO_VERSION }}-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ env.GO_VERSION }}-${{ runner.os }}-

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Cache managed binaries
        uses: actions/cache@v5
        with:
          path: ~/.local/share/bitwindow/assets/bin
          key: managed-binaries-v2-${{ runner.os }}-${{ hashFiles('sidechain-orchestrator/chains_config.json', 'sidechain-orchestrator/config/chains_config.json') }}

      - name: Run bitwindow backend smoke test
        working-directory: bitwindow/server
        run: go test -v -tags integration -run TestBackendRuntimeOwnershipSmoke -timeout 12m ./integrationtest/
        env:
          BITWINDOW_TEST_LOG_DIR: ${{ runner.temp }}/bitwindow-backend-smoke-logs

      - name: Upload backend smoke logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: bitwindow-backend-smoke-logs
          path: ${{ runner.temp }}/bitwindow-backend-smoke-logs
          if-no-files-found: ignore

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            cache-path: ~/.local/share/bitwindow/assets/bin
          - os: windows-latest
            cache-path: ~/AppData/Roaming/10520LayertwoLabs/BitWindow/assets/bin
          - os: macos-latest
            cache-path: ~/Library/Application Support/bitwindow/assets/bin

    steps:
      - uses: actions/checkout@v5

      - name: Cache Go modules (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ env.GO_VERSION }}-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ env.GO_VERSION }}-${{ runner.os }}-

      - name: Cache Go modules (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            %LocalAppData%\go-build
            ~/go/pkg/mod
          key: go-${{ env.GO_VERSION }}-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ env.GO_VERSION }}-${{ runner.os }}-

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Rosetta (macOS ARM)
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install SQLite (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Install SQLite (Windows)
        if: runner.os == 'Windows'
        run: |
          # SQLite is built into Go's database/sql on Windows
          echo "SQLite support built-in on Windows"

      - name: Cache bitcoind binary
        uses: actions/cache@v5
        with:
          path: ${{ matrix.cache-path }}
          key: bitcoind-${{ runner.os }}-v30.2

      - name: Run orchestrator wallet integration tests
        working-directory: sidechain-orchestrator
        run: go test -v -tags integration -timeout 10m ./wallet/

      - name: Run bitwindow wallet integration tests
        working-directory: bitwindow/server
        run: go test -v -tags integration -timeout 10m ./integrationtest/

  hwi-daemon:
    name: hwi daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libusb-1.0-0-dev

      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Fetch libusb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.0.27"
          Invoke-WebRequest "https://github.com/libusb/libusb/releases/download/v$ver/libusb-$ver.7z" -OutFile libusb.7z
          7z x libusb.7z -olibusb-dist
          $dll = Get-ChildItem libusb-dist -Recurse -Filter libusb-1.0.dll |
                 Where-Object { $_.FullName -like '*\VS2022\MS64\dll\*' } | Select-Object -First 1
          if (-not $dll) { throw "no VS2022/MS64 libusb-1.0.dll in libusb-$ver.7z" }
          "LIBUSB_DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Freeze the hwi daemon
        shell: bash
        run: |
          out="$PWD/hwi-out/hwi-daemon"
          [[ "$RUNNER_OS" == "Windows" ]] && out="$out.exe"
          sidechain-orchestrator/hwi-daemon/build.sh "$out"
          # Go execs the daemon, so hand it a path the host understands.
          [[ "$RUNNER_OS" == "Windows" ]] && out="$(cygpath -w "$out")"
          echo "ORCHESTRATOR_HWI_DAEMON=$out" >> "$GITHUB_ENV"

      - name: Run the daemon smoke test
        working-directory: sidechain-orchestrator
        run: go test -v -run TestHWIDaemonSmoke -timeout 10m ./wallet/

  replay-protection:
    name: replay protection (macOS)
    runs-on: macos-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ env.GO_VERSION }}-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ env.GO_VERSION }}-${{ runner.os }}-

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Stock (unpatched) Bitcoin Core for the "must reject non-final" phase.
      - name: Download stock bitcoind
        run: |
          curl -sSL -o core.tar.gz https://bitcoincore.org/bin/bitcoin-core-30.2/bitcoin-30.2-arm64-apple-darwin.tar.gz
          tar xzf core.tar.gz
          echo "BITCOIND_STOCK=$PWD/bitcoin-30.2/bin/bitcoind" >> "$GITHUB_ENV"

      # Fork bitcoind (nLockTime replay patch) is committed at
      # sidechain-orchestrator/testdata/bitcoind-replay (macOS arm64).
      - name: Run replay-protection integration test
        working-directory: sidechain-orchestrator
        env:
          BITCOIND_REPLAY: ${{ github.workspace }}/sidechain-orchestrator/testdata/bitcoind-replay
        run: |
          chmod +x "$BITCOIND_REPLAY"
          go test -v -tags integration -run TestReplayLockTime -timeout 12m .
