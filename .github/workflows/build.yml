            mv coinshift-binaries-Linux/coinshift-x86_64-linux-gnu.zip test-coinshift-x86_64-unknown-linux-gnu.zip || true
            mv coinshift-binaries-Linux/CoinShift-x86_64.AppImage test-coinshift-x86_64-unknown-linux-gnu.AppImage || true
