      - name: Install jq for merging version files
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Merge individual version.json files into versions.json
        continue-on-error: true
        run: |
          echo "Downloading existing versions.json..."

          # Download existing versions.json from server
          if curl -s -f "https://releases.drivechain.info/versions.json" -o versions.json 2>/dev/null; then
            echo "Downloaded existing versions.json"
          else
            echo "No existing versions.json found, creating new one"
            echo '{}' > versions.json
          fi

          echo "Merging generated version.json files..."
          echo "Looking for version files in artifact directories..."
          version_files=$(find . -name "*-*-version.json" -type f)

          if [ -z "$version_files" ]; then
            echo "No version files found - keeping existing versions.json"
          else
            echo "Found version files:"
            echo "$version_files"

            # Only merge version files for clients that have version updates
            echo "$version_files" | while read version_file; do
              if [ -n "$version_file" ]; then
                # Extract client name from version file (e.g., thunder-windows-latest-version.json -> thunder)
                client_name=$(basename "$version_file" | sed 's/-[^-]*-latest-version\.json$//')
                upload_var="UPLOAD_${client_name^^}"

                if [ "${!upload_var}" = "true" ]; then
                  echo "Merging $version_file for $client_name (version increased)..."
                  # Use jq to merge the individual version file into the main versions.json
                  jq -s '.[0] * .[1]' versions.json "$version_file" > temp_versions.json
                  mv temp_versions.json versions.json
                else
                  echo "Skipping $version_file for $client_name (version not increased)"
                fi
              fi
            done
          fi

          echo "Final versions.json:"
          cat versions.json | jq . || echo "Failed to parse versions.json"

      - name: Generate hashes.json from final artifacts
        continue-on-error: true
        run: |
          # Download existing hashes.json from server to preserve hashes for unchanged binaries
          if curl -s -f "https://releases.drivechain.info/hashes.json" -o hashes.json 2>/dev/null; then
            echo "Downloaded existing hashes.json"
          else
            echo "No existing hashes.json found, creating new one"
            echo '{}' > hashes.json
          fi

          # Hash all final renamed artifacts (test-* and BitWindow-*)
          for file in test-*.zip test-*.exe test-*.AppImage BitWindow-*.zip BitWindow-*.exe BitWindow-*.AppImage BitWindow-*.dmg; do
            if [ -f "$file" ]; then
              hash=$(sha256sum "$file" | awk '{print $1}')
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
              jq --arg file "$file" --arg hash "$hash" --arg size "$size" \
                '.[$file] = {"sha256": $hash, "size": ($size | tonumber)}' \
                hashes.json > tmp_hashes.json && mv tmp_hashes.json hashes.json
              echo "Hashed $file: $hash ($size bytes)"
            fi
          done

          echo "Final hashes.json:"
          cat hashes.json | jq .

      - name: Upload hashes.json as artifact
        uses: actions/upload-artifact@v5
        with:
          name: hashes
          path: hashes.json

      - name: Generate appcast for auto-updater
        continue-on-error: true
        run: |
          # Process appcast fragments for each client that has version updates
          for client in bitwindow thunder truthcoin photon bitnames bitassets zside coinshift; do
            # Check if this client should be uploaded (version increased)
            upload_var="UPLOAD_${client^^}"
            if [ "${!upload_var}" != "true" ]; then
              echo "Skipping $client appcast generation (version not increased)"
              continue
            fi

            echo "Looking for $client appcast fragments in artifact directories..."

            macos_fragment=$(find . -name "*${client}*macos*fragment*.xml" -type f 2>/dev/null | head -1 || true)
            windows_fragment=$(find . -name "*${client}*windows*fragment*.xml" -type f 2>/dev/null | head -1 || true)

            if [ -n "$macos_fragment" ] || [ -n "$windows_fragment" ]; then
              echo "Found appcast fragments for $client:"
              [ -n "$macos_fragment" ] && echo "  macOS: $macos_fragment"
              [ -n "$windows_fragment" ] && echo "  Windows: $windows_fragment"

              # Start building the appcast XML
              echo '<?xml version="1.0" encoding="UTF-8"?>' > "appcast-$client.xml"
              echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">' >> "appcast-$client.xml"
              echo '  <channel>' >> "appcast-$client.xml"
              echo "    <title>$client</title>" >> "appcast-$client.xml"
              echo '    <link>https://releases.drivechain.info/</link>' >> "appcast-$client.xml"
              echo "    <description>$client - Drivechain Application</description>" >> "appcast-$client.xml"
              echo '    <language>en</language>' >> "appcast-$client.xml"

              # Add Windows fragment if it exists
              if [ -n "$windows_fragment" ] && [ -f "$windows_fragment" ]; then
                echo "    <!-- Windows fragment -->" >> "appcast-$client.xml"
                cat "$windows_fragment" >> "appcast-$client.xml"
              fi

              # Add macOS fragment if it exists
              if [ -n "$macos_fragment" ] && [ -f "$macos_fragment" ]; then
                cat "$macos_fragment" >> "appcast-$client.xml"
              fi

              # Close the XML
              echo '  </channel>' >> "appcast-$client.xml"
              echo '</rss>' >> "appcast-$client.xml"

              echo "Generated appcast-$client.xml"
              cat "appcast-$client.xml"
            else
              echo "No appcast fragments found for $client, skipping"
            fi
          done

      - name: Upload artifacts to releases.drivechain.info
        uses: yitianyigexiangfa/ssh-scp-ssh-pipelines@v1.1.5
        continue-on-error: true
        with:
          host: 45.33.96.47
          user: root
          pass: ${{ secrets.RELEASES_SERVER_PW }}
          port: 22
          scp: |
            'BitWindow-*.exe' => '/var/www/html/'
            'BitWindow-*.zip' => '/var/www/html/'
            'BitWindow-*.dmg' => '/var/www/html/'
            'BitWindow-*.AppImage' => '/var/www/html/'
            'test-*.zip' => '/var/www/html/'
            'test-*.exe' => '/var/www/html/'
            'test-*.AppImage' => '/var/www/html/'
            'versions.json' => '/var/www/html/'
            'hashes.json' => '/var/www/html/'
            'appcast-bitwindow.xml' => '/var/www/html/'
            'appcast-bitnames.xml' => '/var/www/html/'
            'appcast-bitassets.xml' => '/var/www/html/'
            'appcast-thunder.xml' => '/var/www/html/'
            'appcast-truthcoin.xml' => '/var/www/html/'
            'appcast-photon.xml' => '/var/www/html/'
            'appcast-zside.xml' => '/var/www/html/'
            'appcast-coinshift.xml' => '/var/www/html/'
