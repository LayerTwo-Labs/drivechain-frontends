            mv photon-binaries-macOS/photon-osx64.zip test-photon-x86_64-apple-darwin.zip || true
            mv photon-binaries-Linux/photon-x86_64-linux-gnu.zip test-photon-x86_64-unknown-linux-gnu.zip || true
            mv photon-binaries-Linux/Photon-x86_64.AppImage test-photon-x86_64-unknown-linux-gnu.AppImage || true
            mv photon-binaries-Windows/photon.exe test-photon-x86_64-windows.exe || true
          else
