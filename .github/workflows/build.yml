          fi

          # Truthcoin - only rename if version increased
          if [ "$UPLOAD_TRUTHCOIN" = "true" ]; then
            echo "Preparing Truthcoin artifacts for upload..."
            mv truthcoin-binaries-macOS/truthcoin-osx64.zip test-truthcoin-x86_64-apple-darwin.zip || true
            mv truthcoin-binaries-Linux/truthcoin-x86_64-linux-gnu.zip test-truthcoin-x86_64-unknown-linux-gnu.zip || true
            mv truthcoin-binaries-Linux/Truthcoin-x86_64.AppImage test-truthcoin-x86_64-unknown-linux-gnu.AppImage || true
