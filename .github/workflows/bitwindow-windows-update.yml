name: BitWindow Windows Update

# Installs an older build, points it at a local appcast, lets WinSparkle run the
# update unattended, and asserts the newer version actually landed on disk.
#
# The bug this guards: the runner used to put the Flutter process in a
# KILL_ON_JOB_CLOSE job object. The installer WinSparkle launches inherited that
# job, so when Inno's Restart Manager closed BitWindow the kernel killed the
# installer with it and the update silently never completed.

on:
  pull_request:
    paths:
      - "bitwindow/windows/**"
      - "bitwindow/lib/main.dart"
      - "sail_ui/lib/providers/binaries/**"
      - "scripts/build-windows.sh"
      - ".github/workflows/bitwindow-windows-update.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.0"
  FEED_PORT: "8000"
  NEW_VERSION: "99.0.0"
  APP_ID: "DE47B41F-F9FE-43D5-9243-DB15A080F621"

jobs:
  update:
    # windows-2022 ships Inno Setup, which fastforge's windows-exe job needs.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Generate a throwaway signing key
        working-directory: bitwindow
        shell: bash
        run: |
          dart pub get
          dart run auto_updater:generate_keys
          # Runner.rc embeds dsa_pub.pem as the DSAPEM resource, so the build
          # under test trusts this key and no production key is involved.
          cp dsa_pub.pem dsa_pub.pem.bak
          ls -la dsa_pub.pem

      - name: Build the installer under test
        working-directory: bitwindow
        shell: bash
        env:
          BITWINDOW_APPCAST_URL: http://127.0.0.1:${{ env.FEED_PORT }}/appcast-test.xml
        run: |
          echo "BITWINDOW_APPCAST_URL=$BITWINDOW_APPCAST_URL" > build-vars.env
          flutter build windows --dart-define-from-file=build-vars.env
          fastforge release --name prod --jobs windows-exe
          mkdir -p "$RUNNER_TEMP/feed"
          find release -name '*-windows-setup.exe' | head -1 | xargs -I{} cp {} "$RUNNER_TEMP/old-setup.exe"

      # Only Inno's AppVersion changes, so the built exe's FileVersion stays at
      # the pubspec version — which is exactly what WinSparkle compares against.
      - name: Build the "newer" installer
        working-directory: bitwindow
        shell: bash
        run: |
          fastforge release --name prod --jobs windows-exe --build-version ${{ env.NEW_VERSION }}
          find release -name '*-windows-setup.exe' | head -1 | xargs -I{} cp {} "$RUNNER_TEMP/feed/new-setup.exe"

      - name: Write the appcast
        working-directory: bitwindow
        shell: bash
        run: |
          SIG=$(dart run auto_updater:sign_update "$RUNNER_TEMP/feed/new-setup.exe" dsa_priv.pem)
          LEN=$(stat -c%s "$RUNNER_TEMP/feed/new-setup.exe")
          cat > "$RUNNER_TEMP/feed/appcast-test.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>BitWindow</title>
              <item>
                <title>${{ env.NEW_VERSION }}</title>
                <sparkle:version>${{ env.NEW_VERSION }}</sparkle:version>
                <enclosure
                  url="http://127.0.0.1:${{ env.FEED_PORT }}/new-setup.exe"
                  sparkle:version="${{ env.NEW_VERSION }}"
                  sparkle:os="windows"
                  sparkle:installerArguments="/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG=$RUNNER_TEMP\inno.log"
                  $SIG
                  length="$LEN"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          cat "$RUNNER_TEMP/feed/appcast-test.xml"

      # WinSparkle uses WinINet and accepts plain HTTP; the HTTPS requirement is
      # a macOS-Sparkle rule.
      - name: Serve the feed
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m","http.server","${{ env.FEED_PORT }}" `
            -WorkingDirectory "$env:RUNNER_TEMP\feed"
          Start-Sleep -Seconds 3
          Invoke-WebRequest "http://127.0.0.1:${{ env.FEED_PORT }}/appcast-test.xml" -UseBasicParsing | Out-Null

      - name: Install the older build
        shell: pwsh
        run: |
          Start-Process "$env:RUNNER_TEMP\old-setup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{${{ env.APP_ID }}}_is1"
          if (-not (Test-Path $key)) {
            $key = "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{${{ env.APP_ID }}}_is1"
          }
          $before = (Get-ItemProperty $key).DisplayVersion
          Write-Host "installed version before update: $before"
          "INSTALL_KEY=$key"     | Out-File -Append $env:GITHUB_ENV
          "VERSION_BEFORE=$before" | Out-File -Append $env:GITHUB_ENV

      # WinSparkle skips the check if it ran recently or the version was skipped.
      - name: Clear WinSparkle state
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "HKCU:\Software\LayerTwo Labs\BitWindow\WinSparkle" -ErrorAction SilentlyContinue

      # initAutoUpdater runs before the backend boots and checkForUpdates
      # (inBackground) maps to win_sparkle_check_update_without_ui, so launching
      # is all the driving needed.
      - name: Launch and let it update
        shell: pwsh
        env:
          BITWINDOWD_DATADIR: ${{ runner.temp }}\bitwindow-data
        run: |
          $exe = (Get-ItemProperty $env:INSTALL_KEY).InstallLocation + "bitwindow.exe"
          Start-Process $exe
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $now = (Get-ItemProperty $env:INSTALL_KEY -ErrorAction SilentlyContinue).DisplayVersion
            if ($now -eq "${{ env.NEW_VERSION }}") {
              Write-Host "updated to $now"
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          Write-Host "still on $((Get-ItemProperty $env:INSTALL_KEY -ErrorAction SilentlyContinue).DisplayVersion)"
          throw "update did not complete within 5 minutes"

      - name: Stop leftovers
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("bitwindow","bitwindowd","orchestratord","bitcoind","bip300301-enforcer")) {
            taskkill /F /IM "$name.exe" 2>$null
          }
          exit 0

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: windows-update-logs
          path: |
            ${{ runner.temp }}/inno.log
            ${{ runner.temp }}/bitwindow-data/**/*.log
          if-no-files-found: ignore
