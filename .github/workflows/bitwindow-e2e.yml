name: BitWindow E2E

# Drives `just run` on Linux, macOS, and Windows and asserts that
# bitwindowd + drivechaind boot, run, shut down, and survive a restart.
# Each test maps to one user-reported issue; they run independently so
# a single platform regression lights up one clear signal.

on:
  pull_request:
    paths:
      - "bitwindow/**"
      - "sail_ui/**"
      - "sidechain_core/**"
      - "sidechain-orchestrator/**"
      - "scripts/**"
      - ".github/workflows/bitwindow-e2e.yml"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.8"
  GO_VERSION: "1.27"
  # The app loads the host arch, so a second macOS arch is dead build work.
  BITWINDOW_HOST_ARCH_ONLY: "1"

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-sdk-:channel:-:version:-:os:-:arch:
          pub-cache: true
          pub-cache-key: flutter-pub-:channel:-:version:-:os:-:arch:

      - name: Cache Go modules (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key:
            go-e2e-${{ env.GO_VERSION }}-${{ runner.os }}-${{
            hashFiles('**/go.sum') }}
          restore-keys: go-e2e-${{ env.GO_VERSION }}-${{ runner.os }}-

      - name: Cache Go modules (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key:
            go-e2e-${{ env.GO_VERSION }}-${{ runner.os }}-${{
            hashFiles('**/go.sum') }}
          restore-keys: go-e2e-${{ env.GO_VERSION }}-${{ runner.os }}-

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache the hwi-daemon binary
        id: hwi-daemon-cache
        uses: actions/cache@v5
        with:
          path: bitwindow/assets/bin/hwi-daemon*
          key:
            hwi-daemon-${{ runner.os }}-${{
            hashFiles('sidechain-orchestrator/hwi-daemon/**') }}

      # download-binaries.sh rebuilds a binary older than its sources, and the
      # checkout stamps the sources with the current time.
      - name: Mark the cached hwi-daemon current
        if: steps.hwi-daemon-cache.outputs.cache-hit == 'true'
        shell: bash
        run: touch bitwindow/assets/bin/hwi-daemon*

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -name '*google-chrome*' -delete
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            sqlite3 libsqlite3-dev xvfb xdotool

      - name: Install Rosetta (macOS)
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # --- Tests, one per user-reported issue. Each runs independently so
      # --- a single platform regression is a single clear signal.

      - name: Issue 1 — boot test
        id: boot
        working-directory: bitwindow/e2e
        run:
          go test -tags e2e -v -timeout 20m -run TestJustRunBootsDaemons ./...
        env:
          BITWINDOW_TEST_LOG_DIR: ${{ runner.temp }}/e2e-logs/boot
          FLUTTER_RUN_ARGS: ${{ runner.os == 'Windows' && '-v' || '' }}

      - name: Issue 2 — shutdown test
        id: shutdown
        if: always() && steps.boot.conclusion == 'success'
        working-directory: bitwindow/e2e
        run:
          go test -tags e2e -v -timeout 15m -run TestJustRunShutsDownDaemons
          ./...
        env:
          BITWINDOW_TEST_LOG_DIR: ${{ runner.temp }}/e2e-logs/shutdown
          FLUTTER_RUN_ARGS: ${{ runner.os == 'Windows' && '-v' || '' }}

      - name: Issue 3 — restart test
        id: restart
        if: always() && steps.shutdown.conclusion == 'success'
        working-directory: bitwindow/e2e
        run: go test -tags e2e -v -timeout 25m -run TestJustRunRestart ./...
        env:
          BITWINDOW_TEST_LOG_DIR: ${{ runner.temp }}/e2e-logs/restart
          FLUTTER_RUN_ARGS: ${{ runner.os == 'Windows' && '-v' || '' }}

      # A relaunch inside the owner grace must not kill the daemons the first
      # launch still runs.
      - name: Fast relaunch test
        id: fast_relaunch
        if: always() && steps.restart.conclusion == 'success'
        working-directory: bitwindow/e2e
        run:
          go test -tags e2e -v -timeout 25m -run TestFastRelaunchKeepsDrivechaindAlive
          ./...
        env:
          BITWINDOW_TEST_LOG_DIR: ${{ runner.temp }}/e2e-logs/fast-relaunch
          FLUTTER_RUN_ARGS: ${{ runner.os == 'Windows' && '-v' || '' }}

      # Every way out of the app must give the user a working app back.
      - name: Exit matrix restart test
        id: exit_matrix
        if: always() && steps.fast_relaunch.conclusion == 'success'
        working-directory: bitwindow/e2e
        run:
          go test -tags e2e -v -timeout 40m -run TestEveryExitPathRestartsClean
          ./...
        env:
          BITWINDOW_TEST_LOG_DIR: ${{ runner.temp }}/e2e-logs/exit-matrix
          FLUTTER_RUN_ARGS: ${{ runner.os == 'Windows' && '-v' || '' }}

      - name: Issue 2b — window-close shutdown test
        id: window_close
        if: always() && steps.boot.conclusion == 'success'
        working-directory: bitwindow/e2e
        run:
          go test -tags e2e -v -timeout 15m -run TestWindowCloseShutsDownDaemons
          ./...
        env:
          BITWINDOW_TEST_LOG_DIR: ${{ runner.temp }}/e2e-logs/window-close
          FLUTTER_RUN_ARGS: ${{ runner.os == 'Windows' && '-v' || '' }}

      # A crash must not leave daemons behind.
      - name: Issue 4 — force-kill reap test
        id: force_kill
        if: always() && steps.boot.conclusion == 'success'
        working-directory: bitwindow/e2e
        run:
          go test -tags e2e -v -timeout 15m -run TestForceKillingAppReapsDaemons
          ./...
        env:
          BITWINDOW_TEST_LOG_DIR: ${{ runner.temp }}/e2e-logs/force-kill
          FLUTTER_RUN_ARGS: ${{ runner.os == 'Windows' && '-v' || '' }}

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
