name: sidechain_core
description: Headless sidechain runtime — generated protobuf, RPC clients, providers
version: 0.0.1
publish_to: none

environment:
  sdk: 3.13.7
  flutter: 3.47.9

dependencies:
  auto_route: ^11.2.0
  collection: ^1.19.1
  connectrpc: ^2.0.1
  crypto: ^3.0.8
  desktop_multi_window:
    git:
      url: https://github.com/octobocto/flutter-plugins.git
      ref: b9a9f5684eb1c81e203d17efef2915e183b05e9e
      path: packages/desktop_multi_window
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  get_it: ^9.3.0
  http: ^1.6.0
  intl: ^0.20.3
  logger:
    path: ../third_party/logger
  path: ^1.9.1
  protobuf: ^6.1.0
  thirds:
    path: ../third_party/thirds
  web: ^1.1.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/chains_config.json
    - assets/migrations/
