name: sail_ui
description: SideSail Design System
version: 0.0.1
publish_to: none

environment:
  sdk: 3.13.5
  flutter: 3.47.7

dependencies:
  archive: ^4.5.2
  auto_route: ^11.2.0
  auto_updater: ^1.0.0
  collection: ^1.19.1
  connectrpc: 1.0.0
  file_picker: ^13.3.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_custom_tabs: ^2.6.0
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.3.2
  get_it: ^8.3.0
  http: ^1.6.0
  intl: ^0.20.3
  logger: ^2.8.0
  path: ^1.9.1
  sidechain_core:
    path: ../sidechain_core
  skeletonizer: ^3.0.0
  stacked: ^3.5.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1

flutter:
  assets:
    - assets/svgs/
    - assets/pngs/
    - assets/quotes.json
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
