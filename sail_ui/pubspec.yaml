name: sail_ui
description: SideSail Design System
version: 0.0.1
publish_to: none

environment:
  sdk: 3.12.2
  flutter: 3.44.8

dependencies:
  dart_coin_rpc:
    git:
      url: https://github.com/barebitcoin/dart_coin_rpc.git
      # master, as of 08.06.2024
      ref: ab0b7cb2de6e1634a6e65892770ed0d157d38443
  flutter:
    sdk: flutter
  flutter_custom_tabs: ^2.5.0
  flutter_svg: ^2.3.0
  dio: 5.11.0
  fixnum: ^1.1.1
  path: ^1.9.1
  archive: ^4.0.9
  intl: ^0.20.3
  crypto: ^3.0.7
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  bip39_mnemonic: ^4.0.1
  dart_bip32_bip44: ^0.2.0
  logger: ^2.7.0
  stacked: ^3.5.0
  skeletonizer: ^2.1.3
  auto_route: ^11.1.0
  get_it: ^8.3.0
  collection: ^1.19.1
  path_provider: ^2.1.6
  synchronized: ^3.4.1+1
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  connectrpc: 1.0.0
  convert: ^3.1.2
  desktop_multi_window:
    git:
      url: https://github.com/octobocto/flutter-plugins.git
      ref: 252f3f7910288500039c39ae2b944622a0e55152
      path: packages/desktop_multi_window
  auto_updater: ^1.0.0
  window_manager: ^0.5.2
  web: ^1.1.1
  thirds: ^0.2.0-alpha.1

  file_picker: ^11.0.2
  http: ^1.6.0
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  drivechain_lints:
    path: ../drivechain_lints
  auto_route_generator: ^10.4.0
  build_runner: ^2.15.1

flutter:
  assets:
    - assets/svgs/
    - assets/pngs/
    - assets/chains_config.json
    - assets/quotes.json
    - assets/migrations/
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
