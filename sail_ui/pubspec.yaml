name: sail_ui
description: SideSail Design System
version: 0.0.1
publish_to: none

environment:
  sdk: 3.12.2
  flutter: 3.44.8

dependencies:
  archive: ^4.0.9
  auto_route: ^11.1.0
  auto_updater: ^1.0.0
  collection: ^1.19.1
  connectrpc: 1.0.0
  file_picker: ^11.0.2
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_custom_tabs: ^2.6.0
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.3.0
  get_it: ^8.3.0
  http: ^1.6.0
  intl: ^0.20.3
  logger: ^2.7.0
  path: ^1.9.1
  sidechain_core:
    path: ../sidechain_core
  skeletonizer: ^2.1.3
  stacked: ^3.5.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  drivechain_lints:
    path: ../drivechain_lints
  auto_route_generator: ^10.4.0
  build_runner: ^2.15.1

flutter:
  assets:
    - assets/svgs/
    - assets/pngs/
    - assets/quotes.json
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
